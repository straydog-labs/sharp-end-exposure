<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Straydog Labs — Coaching</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 48'%3E%3Crect x='8' y='4' width='24' height='40' rx='12' fill='none' stroke='%23e89252' stroke-width='4'/%3E%3Crect x='4' y='16' width='8' height='16' rx='3' fill='none' stroke='%23e89252' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* Dark grey (not near-black). Surface stays one step lighter than bg;
       border steps up again so panels/chips still edge-define. */
    --bg:#2e2e2e;
    --surface:#3a3a3a;
    --border:#4a4a4a;
    --text:#f0f0f0;
    /* Brighter than old #999 — keeps AA on the lighter --surface */
    --text-secondary:#a8a8a8;
    /* Accent/danger lifted with the bg so links + error copy stay readable */
    --accent:#e89252;
    --success:#3B6D11;
    --warning:#BA7517;
    --danger:#ef8575;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  a{color:var(--accent);}

  /* ---------- Login screen ---------- */
  #login{
    position:fixed;inset:0;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;
  }
  #login.hidden{display:none;}
  .login-box{width:340px;}
  .login-word{
    font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    text-align:center;margin-bottom:4px;
  }
  .login-word span{color:var(--accent);}
  .login-sub{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-secondary);text-align:center;margin-bottom:32px;
  }
  .login-field{margin-bottom:12px;}
  .login-field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.04em;}
  .login-field input{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;color:var(--text);font-family:'Space Mono',monospace;font-size:14px;outline:none;
  }
  .login-field input:focus{border-color:var(--accent);}
  .login-field input.shake{animation:shake .35s;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }
  #login-btn{
    width:100%;margin-top:8px;background:var(--accent);border:none;border-radius:8px;
    padding:12px 14px;color:#0d0d0d;font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:14px;cursor:pointer;
  }
  #login-btn:hover{opacity:.9;}
  #login-btn:disabled{opacity:.5;cursor:default;}
  #login-error{margin-top:14px;font-size:12px;color:var(--danger);min-height:16px;text-align:center;}

  /* ---------- Shell ---------- */
  #app{display:none;min-height:100vh;}
  #app.visible{display:block;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;border-bottom:1px solid var(--border);background:var(--surface);
  }
  .topbar-word{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .topbar-word span{color:var(--accent);}
  .topbar-right{display:flex;align-items:center;gap:16px;font-size:12.5px;color:var(--text-secondary);}
  #signout-btn{
    background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;
    color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:12.5px;cursor:pointer;
  }
  #signout-btn:hover{border-color:var(--accent);color:var(--accent);}

  #main{max-width:1100px;margin:0 auto;padding:32px 24px 60px;}
  .page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--text-secondary);margin-bottom:28px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;}
  .panel-title{
    font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-secondary);margin-bottom:14px;
  }
  .stub{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:40px 24px;text-align:center;color:var(--text-secondary);font-size:13px;line-height:1.6;
  }
  .stub b{color:var(--text);}
  .stub code{
    background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;
    font-family:'Space Mono',monospace;font-size:11.5px;color:var(--accent);
  }

  /* ---------- Coach: roster + detail ---------- */
  .coach-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;}
  .roster-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;
  }
  .roster-row:last-child{border-bottom:none;}
  .roster-row:hover{background:rgba(255,255,255,.02);}
  .roster-row.active{background:rgba(232,146,82,.1);border-left:3px solid var(--accent);padding-left:12px;}
  .roster-name{font-size:13px;font-weight:600;}
  .roster-meta{font-size:11px;color:var(--text-secondary);margin-top:2px;}
  .roster-empty{font-size:13px;color:var(--text-secondary);padding:12px 4px;}

  .detail-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
  .detail-title{font-size:16px;font-weight:700;}
  .detail-sub{font-size:12px;color:var(--text-secondary);}
  .detail-section{margin-bottom:20px;}
  .detail-section:last-child{margin-bottom:0;}

  .assign-card{
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:14px 16px;margin-bottom:10px;
  }
  .assign-card:last-child{margin-bottom:0;}
  .assign-card.done{opacity:.55;}
  .assign-title{font-size:13.5px;font-weight:600;margin-bottom:4px;}
  .assign-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px;}
  .assign-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-secondary);}
  .assign-dates{display:flex;flex-direction:column;gap:3px;}
  .assign-due{font-family:'Space Mono',monospace;}
  .assign-due.overdue{color:var(--danger);}
  .assign-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .assign-complete-btn{
    background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 12px;
    color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .assign-complete-btn:hover{border-color:var(--success);color:#7fbf3f;}
  .assign-complete-btn:disabled{opacity:.5;cursor:default;}
  .assign-repeat-btn{
    background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 12px;
    color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .assign-repeat-btn:hover{border-color:var(--accent);color:var(--accent);}
  .assign-repeat-btn:disabled{opacity:.5;cursor:default;}
  .assign-done-tag{font-size:11px;font-weight:700;color:#7fbf3f;}

  .roster-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .roster-stat{
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 12px;
  }
  .roster-stat-val{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.02em;}
  .roster-stat-label{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-secondary);margin-top:6px;
  }

  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:11.5px;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.03em;}
  .form-row input, .form-row textarea, .form-row select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;
    padding:9px 11px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus{border-color:var(--accent);}
  .form-row textarea{resize:vertical;min-height:60px;font-family:'Space Grotesk',sans-serif;}
  .form-actions{display:flex;gap:8px;align-items:center;}
  .btn-primary{
    background:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:9px 18px;
    color:#0d0d0d;font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .btn-primary:hover{opacity:.9;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .form-note{font-size:11.5px;color:var(--text-secondary);margin-top:8px;}
  .form-error{font-size:11.5px;color:var(--danger);margin-top:8px;}
  .form-success{font-size:11.5px;color:#7fbf3f;margin-top:8px;}

  .note-card{
    background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;
  }
  .note-card:last-child{margin-bottom:0;}
  .note-meta{font-size:11px;color:var(--text-secondary);margin-bottom:5px;}
  .note-text{font-size:13px;line-height:1.5;}

  .assign-resource{margin-bottom:8px;}
  .assign-resource a{font-size:12px;color:var(--accent);text-decoration:none;}
  .assign-resource a:hover{text-decoration:underline;}
  .assign-resource span{font-size:12px;color:var(--text-secondary);}

  .completed-group{margin-top:14px;}
  .completed-group summary{
    cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-secondary);padding:6px 0;list-style:none;
  }
  .completed-group summary::-webkit-details-marker{display:none;}
  .completed-group summary::before{content:'▸ ';}
  .completed-group[open] summary::before{content:'▾ ';}
  .completed-group summary:hover{color:var(--text);}
  .completed-group .assign-card{margin-top:10px;}
  .open-empty{font-size:12.5px;color:var(--text-secondary);padding:4px 0 4px;}

  .link-athlete-box{margin-top:18px;padding-top:18px;border-top:1px solid var(--border);}

  /* ---------- New assignment: full-screen step flow (baseline-weight) ---------- */
  .assign-launch{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--accent);border:none;border-radius:12px;padding:18px 20px;
    color:#0d0d0d;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;cursor:pointer;
  }
  .assign-launch:hover{opacity:.92;}
  .assign-launch-sub{display:block;font-size:12.5px;font-weight:600;opacity:.7;margin-top:2px;}
  .assign-launch-arrow{font-size:22px;line-height:1;}
  .assign-inline-success{
    margin-top:10px;font-size:13px;color:#7fbf3f;background:rgba(63,109,17,.15);
    border:1px solid rgba(127,191,63,.35);border-radius:8px;padding:10px 12px;
  }

  #assign-wizard-overlay{
    display:none;position:fixed;inset:0;z-index:2000;background:var(--bg);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #assign-wizard-overlay.open{display:block;}
  .aw-shell{min-height:100%;display:flex;flex-direction:column;}
  .aw-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px 0;max-width:520px;margin:0 auto;width:100%;
  }
  .aw-back{
    background:none;border:none;color:var(--text-secondary);font-family:'Space Grotesk',sans-serif;
    font-size:14px;font-weight:600;cursor:pointer;padding:4px 0;
  }
  .aw-back:hover{color:var(--text);}
  .aw-word{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-secondary);
  }
  .aw-word span{color:var(--accent);}
  .aw-content{
    max-width:520px;margin:0 auto;padding:20px 20px 48px;width:100%;box-sizing:border-box;
  }
  .aw-eyebrow{
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:8px;
  }
  .aw-hero{
    font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px;letter-spacing:-.02em;
  }
  .aw-hero-sub{
    font-size:14px;color:var(--text-secondary);line-height:1.55;margin-bottom:20px;
  }
  .aw-prog{
    height:2px;background:rgba(255,255,255,.08);border-radius:1px;margin-bottom:24px;overflow:hidden;
  }
  .aw-prog-fill{
    height:100%;background:var(--accent);border-radius:1px;transition:width .35s ease;width:0%;
  }
  .aw-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:22px 18px;margin-bottom:16px;
  }
  .aw-step-num{
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);margin-bottom:8px;
  }
  .aw-q{
    font-size:20px;font-weight:700;line-height:1.3;margin-bottom:6px;color:var(--text);
  }
  .aw-hint{
    font-size:13px;color:var(--text-secondary);line-height:1.55;margin-bottom:16px;
  }
  .aw-path{
    font-size:13px;color:var(--text-secondary);line-height:1.45;margin-bottom:14px;
  }
  .aw-path b{color:var(--text);font-weight:600;}
  .aw-choices{display:flex;flex-direction:column;gap:8px;width:100%;}
  .aw-chip{
    width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;color:var(--text);font-family:'Space Grotesk',sans-serif;
    font-size:16px;font-weight:600;cursor:pointer;transition:border-color .12s, color .12s, background .12s;
  }
  .aw-chip:hover{border-color:rgba(232,146,82,.5);}
  .aw-chip:active{transform:scale(.985);}
  .aw-chip.selected{background:transparent;border-color:var(--accent);color:var(--accent);}
  .aw-chip-meta{
    display:block;font-size:12.5px;font-weight:500;color:var(--text-secondary);margin-top:4px;
  }
  .aw-chip.selected .aw-chip-meta{color:rgba(232,146,82,.9);}
  .aw-field{margin-bottom:14px;}
  .aw-field:last-child{margin-bottom:0;}
  .aw-field label{
    display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text);margin-bottom:8px;
  }
  .aw-field input, .aw-field textarea, .aw-field select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:16px;outline:none;
  }
  .aw-field input:focus, .aw-field textarea:focus, .aw-field select:focus{border-color:var(--accent);}
  .aw-field textarea{resize:vertical;min-height:140px;line-height:1.5;}
  .aw-lib-results{
    max-height:min(42vh,320px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
  }
  .aw-lib-empty{font-size:14px;color:var(--text-secondary);padding:8px 2px;}
  .aw-next{
    width:100%;background:var(--accent);border:none;border-radius:14px;color:#0d0d0d;
    font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;padding:18px;cursor:pointer;
    margin-bottom:10px;
  }
  .aw-next:hover{opacity:.92;}
  .aw-next:disabled{opacity:.35;cursor:default;}
  .aw-secondary-btn{
    width:100%;background:none;border:none;color:var(--text-secondary);
    font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;padding:10px;cursor:pointer;
  }
  .aw-secondary-btn:hover{color:var(--text);}
  .aw-linkish{
    background:none;border:none;padding:8px 0;color:var(--accent);font-family:'Space Grotesk',sans-serif;
    font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  }
  .aw-msg{min-height:20px;margin-bottom:8px;font-size:13px;}
  .aw-msg .form-error{color:var(--danger);margin:0;}
  .aw-msg .form-success{color:#7fbf3f;margin:0;}

  /* ---------- Athlete training view ---------- */
  .training-header{margin-bottom:20px;}
</style>
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="login">
    <div class="login-box">
      <div class="login-word">STRAY<span>DOG</span> LABS</div>
      <div class="login-sub">Coaching</div>
      <div class="login-field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="username" autofocus>
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password">
      </div>
      <button id="login-btn">Sign in</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- ================= APP SHELL ================= -->
  <div id="app">
    <div id="topbar">
      <div class="topbar-word">STRAY<span>DOG</span> LABS <span style="color:var(--text-secondary);font-weight:400;text-transform:none;letter-spacing:0;">— Coaching</span></div>
      <!-- Founder back-office (roster across coaches, grant/revoke is_coach): founder-dashboard.html -->
      <div class="topbar-right">
        <span id="whoami"></span>
        <button id="signout-btn">Sign out</button>
      </div>
    </div>
    <div id="main"></div>
  </div>

  <!-- Full-screen New assignment flow (baseline-weight step UI) -->
  <div id="assign-wizard-overlay" aria-hidden="true">
    <div class="aw-shell">
      <div class="aw-top">
        <button type="button" class="aw-back" id="aw-cancel">← Cancel</button>
        <div class="aw-word">STRAY<span>DOG</span> · Assign</div>
      </div>
      <div class="aw-content">
        <div class="aw-eyebrow">New assignment</div>
        <div class="aw-hero" id="aw-hero">Assign a drill.</div>
        <div class="aw-hero-sub" id="aw-hero-sub">One step at a time.</div>
        <div class="aw-prog"><div class="aw-prog-fill" id="aw-prog-fill"></div></div>
        <div class="aw-card">
          <div class="aw-step-num" id="aw-step-num">Step 1 of 5</div>
          <div class="aw-q" id="aw-q">—</div>
          <div class="aw-hint" id="aw-hint"></div>
          <div id="wiz-body"></div>
        </div>
        <div class="aw-msg" id="new-a-msg"></div>
        <div id="aw-footer-nav"></div>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var SB_URL = 'https://kwtbqgoqtewrlsjgepwq.supabase.co';
  var SB_KEY = 'sb_publishable_cPznnRs3-ega2M1aYoEpDw_bJVQFS1t';
  var supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);

  var loginEl = document.getElementById('login');
  var appEl = document.getElementById('app');
  var mainEl = document.getElementById('main');
  var whoamiEl = document.getElementById('whoami');
  var emailInput = document.getElementById('login-email');
  var passwordInput = document.getElementById('login-password');
  var loginBtn = document.getElementById('login-btn');
  var loginError = document.getElementById('login-error');

  function sbHeaders(token){
    return {
      'Content-Type': 'application/json',
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + (token || SB_KEY)
    };
  }

  function sbSelect(token, table, query){
    return fetch(SB_URL + '/rest/v1/' + table + '?' + query, { headers: sbHeaders(token) })
      .then(function(res){
        if(!res.ok) return res.json().then(function(err){ throw err; });
        return res.json();
      });
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtDate(d){
    if(!d) return '—';
    // Date-only strings (due_date, "YYYY-MM-DD") must NOT go through `new
    // Date(str)` — that parses as UTC midnight, which then renders as the
    // previous day in any timezone behind UTC. Build the Date from local
    // parts instead. Full timestamps (created_at/completed_at) are fine as-is.
    var dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(d);
    var dt = dateOnly ? new Date(d + 'T00:00:00') : new Date(d);
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  }

  function shortId(id){
    return id ? id.slice(0, 8) : '—';
  }

  // Only render resource_link as a clickable href if it's actually http(s) —
  // defends against a javascript:-scheme (or similar) value ending up in an
  // anchor href, however it got into the field.
  function safeUrl(u){
    if(!u) return null;
    return /^https?:\/\//i.test(u.trim()) ? u.trim() : null;
  }

  function assignResourceHtml(a){
    if(!a.resource_link) return '';
    var url = safeUrl(a.resource_link);
    return '<div class="assign-resource">' +
      (url
        ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">Resource link →</a>'
        : '<span>' + escapeHtml(a.resource_link) + '</span>') +
      '</div>';
  }

  // Shared card markup for both the coach-side assignment list and the
  // athlete Train tab. Coach cards get Assigned date + Repeat; athlete
  // cards get Mark complete.
  function assignCardHtml(a, withCompleteButton, withRepeatButton){
    var done = !!a.completed_at;
    var actions = '';
    if(done){
      actions = '<span class="assign-done-tag">✓ Completed ' + fmtDate(a.completed_at) + '</span>';
    } else if(withCompleteButton){
      actions = '<button type="button" class="assign-complete-btn" data-id="' + escapeHtml(a.id) + '">Mark complete</button>';
    } else {
      actions = '<span>Open</span>';
    }
    if(withRepeatButton){
      actions += '<button type="button" class="assign-repeat-btn" data-id="' + escapeHtml(a.id) + '">Repeat workout</button>';
    }
    return '<div class="assign-card' + (done ? ' done' : '') + '"' + (withCompleteButton ? ' data-id="' + escapeHtml(a.id) + '"' : '') + '>' +
      '<div class="assign-title">' + escapeHtml(a.title) + '</div>' +
      (a.description ? '<div class="assign-desc">' + escapeHtml(a.description) + '</div>' : '') +
      assignResourceHtml(a) +
      '<div class="assign-meta">' +
        '<div class="assign-dates">' +
          '<span class="assign-due">Assigned ' + fmtDate(a.created_at) + '</span>' +
          '<span class="assign-due">Due ' + fmtDate(a.due_date) + '</span>' +
        '</div>' +
        '<div class="assign-actions">' + actions + '</div>' +
      '</div>' +
    '</div>';
  }

  // Locked scope: completed assignments must visually separate from open ones
  // (not just dim in place) — open ones render normally, completed ones drop
  // into a collapsed <details> group below, most-recently-completed first.
  function renderAssignmentGroups(rows, withCompleteButton, withRepeatButton){
    var open = rows.filter(function(a){ return !a.completed_at; });
    var done = rows.filter(function(a){ return !!a.completed_at; }).sort(function(a, b){
      return new Date(b.completed_at) - new Date(a.completed_at);
    });
    var html = open.length
      ? open.map(function(a){ return assignCardHtml(a, withCompleteButton, withRepeatButton); }).join('')
      : '<div class="open-empty">No open assignments.</div>';
    if(done.length){
      html += '<details class="completed-group"><summary>Completed (' + done.length + ')</summary>' +
        done.map(function(a){ return assignCardHtml(a, withCompleteButton, withRepeatButton); }).join('') +
        '</details>';
    }
    return html;
  }

  /* ===================== AUTH ===================== */

  function shakeLogin(msg){
    loginError.textContent = msg;
    [emailInput, passwordInput].forEach(function(el){
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
    });
  }

  function attemptLogin(){
    var email = emailInput.value.trim();
    var password = passwordInput.value;
    if(!email || !password){ shakeLogin('Email and password required'); return; }
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';
    loginError.textContent = '';
    supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      if(res.error){
        shakeLogin(res.error.message || 'Sign in failed');
        return;
      }
      enterApp(res.data.session);
    }).catch(function(e){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      shakeLogin('Sign in failed — ' + (e && e.message ? e.message : 'unknown error'));
    });
  }

  loginBtn.addEventListener('click', attemptLogin);
  [emailInput, passwordInput].forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter') attemptLogin(); });
  });

  document.getElementById('signout-btn').addEventListener('click', function(){
    supabaseClient.auth.signOut().then(function(){
      appEl.classList.remove('visible');
      loginEl.classList.remove('hidden');
      emailInput.value = '';
      passwordInput.value = '';
      mainEl.innerHTML = '';
    });
  });

  function enterApp(session){
    if(!session){ return; }
    var user = session.user;
    var token = session.access_token;
    loginEl.classList.add('hidden');
    appEl.classList.add('visible');
    whoamiEl.textContent = user.email;

    sbSelect(token, 'coach_flags', 'select=is_coach&user_id=eq.' + user.id)
      .then(function(rows){
        var isCoach = rows.length > 0 && rows[0].is_coach === true;
        if(isCoach){
          renderCoachView(token, user);
        } else {
          renderAthleteView(token, user);
        }
      })
      .catch(function(){
        // coach_flags unreadable/unreachable — fail safe to athlete view,
        // never assume coach access on an error.
        renderAthleteView(token, user);
      });
  }

  // Restore an already-active session on page reload (e.g. tab refresh),
  // same pattern the SEE app itself uses via onAuthStateChange.
  supabaseClient.auth.getSession().then(function(res){
    var session = res.data && res.data.session ? res.data.session : null;
    if(session) enterApp(session);
  });

          (isMissingFn
            ? 'The <code>link_athlete_by_email</code> function doesn\'t exist yet — run coach-layer-additions.sql (section 4) first.'

  // Cached roster from coach_list_roster() so detail views can show the
  // same display label without a second lookup.
  var _coachRoster = [];

  // Prefer "First Last" when both names are on file; otherwise email;
  // shortId only if neither is available.
  function athleteDisplayLabel(row){
    var first = String(row && row.athlete_first_name != null ? row.athlete_first_name : '').trim();
    var last = String(row && row.athlete_last_name != null ? row.athlete_last_name : '').trim();
    if(first && last) return first + ' ' + last;
    var email = String(row && row.athlete_email != null ? row.athlete_email : '').trim();
    if(email) return email;
    return 'Athlete ' + shortId(row && row.athlete_id);
  }

  function loadRoster(token, user){
    var listEl = document.getElementById('roster-list');
    listEl.innerHTML = '<div class="roster-empty">Loading···</div>';
    // Same rpc POST pattern as link_athlete_by_email — returns
    // { ok: true, roster: [{ link_id, athlete_id, athlete_email,
    //   athlete_first_name, athlete_last_name, status, linked_at }] }
    // scoped to auth.uid(); names/emails aren't on raw coach_athlete_links.
    fetch(SB_URL + '/rest/v1/rpc/coach_list_roster', {
      method: 'POST',
      headers: sbHeaders(token),
      body: JSON.stringify({})
    }).then(function(res){
      return res.json().then(function(body){
        if(!res.ok) throw body;
        return body;
      });
    }).then(function(result){
      if(!result || result.ok !== true){
        var errCode = result && result.error;
        throw { message: errCode ? String(errCode) : 'coach_list_roster returned not-ok' };
      }
      _coachRoster = Array.isArray(result.roster) ? result.roster : [];
      renderRoster(token, user, _coachRoster);
      updateRosterStats(token, _coachRoster);
    }).catch(function(err){
      var isMissingFn = err && (err.code === 'PGRST202' || err.code === '42883');
      listEl.innerHTML =
        '<div class="roster-empty" style="color:var(--danger);">' +
          (isMissingFn
            ? 'The <code>coach_list_roster</code> function doesn\'t exist yet.'
            : 'Failed to load roster. ' + escapeHtml((err && err.message) || 'unknown error')) +
        '</div>';
      updateRosterStats(token, []);
    });
  }

  // Athletes tile = roster length. Sessions tile = count of non-deleted
  // sessions for linked athletes via sessions_select_coach RLS (user_id
  // is the athlete on public.sessions).
  function updateRosterStats(token, roster){
    var athletesEl = document.getElementById('stat-athletes');
    var sessionsEl = document.getElementById('stat-sessions');
    if(athletesEl) athletesEl.textContent = String(roster.length);
    if(!sessionsEl) return;
    if(!roster.length){
      sessionsEl.textContent = '0';
      return;
    }
    sessionsEl.textContent = '…';
    countCoachRosterSessions(token, roster.map(function(r){ return r.athlete_id; }))
      .then(function(n){ sessionsEl.textContent = String(n); })
      .catch(function(){ sessionsEl.textContent = '—'; });
  }

  function countCoachRosterSessions(token, athleteIds){
    var ids = (athleteIds || []).filter(Boolean);
    if(!ids.length) return Promise.resolve(0);
    var q = 'select=id&user_id=in.(' + ids.join(',') + ')&deleted_at=is.null';
    return fetch(SB_URL + '/rest/v1/sessions?' + q, {
      headers: Object.assign(sbHeaders(token), {
        'Prefer': 'count=exact',
        'Range': '0-0'
      })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      var cr = res.headers.get('content-range') || '';
      var slash = cr.lastIndexOf('/');
      if(slash !== -1){
        var total = cr.slice(slash + 1);
        if(total && total !== '*'){
          var n = parseInt(total, 10);
          if(!isNaN(n)) return n;
        }
      }
      return res.json().then(function(rows){
        return Array.isArray(rows) ? rows.length : 0;
      });
    });
  }

  function renderRoster(token, user, roster){
    var listEl = document.getElementById('roster-list');

      listEl.innerHTML = '<div class="roster-empty">No athletes linked yet.</div>';

      return '<div class="roster-row" data-idx="' + i + '" data-athlete-id="' + escapeHtml(row.athlete_id) +
        '" data-athlete-email="' + escapeHtml(email) +
        '" data-athlete-label="' + escapeHtml(label) + '">' +
        '<div>' +
          '<div class="roster-name">' + escapeHtml(label) + '</div>' +
          '<div class="roster-meta mono">Linked ' + fmtDate(row.linked_at) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.roster-row'), function(row){
      row.addEventListener('click', function(){
        Array.prototype.forEach.call(listEl.querySelectorAll('.roster-row'), function(r){ r.classList.remove('active'); });
        row.classList.add('active');
        renderAthleteDetail(
          token,

  var _lastCoachAssignments = [];

  function loadAssignments(token, coachUser, athleteId){
    var el = document.getElementById('detail-assignments');
    sbSelect(token, 'assignments', 'select=*&athlete_id=eq.' + athleteId + '&coach_id=eq.' + coachUser.id + '&deleted_at=is.null&order=due_date.asc.nullslast')
      .then(function(rows){
        _lastCoachAssignments = Array.isArray(rows) ? rows : [];
        if(!_lastCoachAssignments.length){
          el.innerHTML = '<div class="panel-title">Assignments</div><div class="form-note">No assignments yet.</div>';
          return;
        }
        el.innerHTML = '<div class="panel-title">Assignments</div>' +
          renderAssignmentGroups(_lastCoachAssignments, false, true);
        wireCoachAssignmentActions(token, coachUser, athleteId, el);
      })
      .catch(function(err){
        _lastCoachAssignments = [];
        el.innerHTML = '<div class="panel-title">Assignments</div><div class="form-error">Failed to load — ' + escapeHtml(err.message || 'unknown error') + '</div>';
      });
  }

  function wireCoachAssignmentActions(token, coachUser, athleteId, rootEl){
    Array.prototype.forEach.call(rootEl.querySelectorAll('.assign-repeat-btn'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var src = _lastCoachAssignments.find(function(a){ return a.id === id; });
        if(!src) return;
        btn.disabled = true;
        var prev = btn.textContent;
        btn.textContent = 'Repeating...';
        repeatCoachAssignment(token, coachUser, athleteId, src)
          .then(function(){
            return loadAssignments(token, coachUser, athleteId);
          })
          .catch(function(err){
            btn.disabled = false;
            btn.textContent = prev;
            alert('Failed to repeat workout — ' + ((err && err.message) || 'unknown error'));
          });
      });
    });
  }

  // New assignment row copied from an existing one — same idea as the
  // athlete-side +Attempt pattern. Does not modify the source row.
  function repeatCoachAssignment(token, coachUser, athleteId, source){
    var payload = {
      coach_id: coachUser.id,
      athlete_id: athleteId,
      title: source.title,
      description: source.description || null
    };
    // Fresh due_date / completed_at — omit so DB defaults (null) apply.
    if(source.library_item_id) payload.library_item_id = source.library_item_id;
    if(source.resource_link) payload.resource_link = source.resource_link;
    return createCoachLibraryAssignment(token, payload);
  }

  // ── Workout library (coach-side) ─────────────────────────
  // Same workout_library / assignments.library_item_id tables the athlete
  // app uses (createWorkoutLibraryItem / addLibraryItemToTraining in
  // index.html). Coach-side equivalents below — not a copy-paste of those
  // helpers, but the same column names and insert shape.
  var _coachLibCache = [];
  var _coachLibSelectedId = null;

  function coachLibTypeLabel(type){
    if(type === 'strength') return 'Strength';
    if(type === 'power') return 'Power';
    if(type === 'endurance') return 'Endurance';

  function loadCoachWorkoutLibrary(token){

  }

  // Coach-side insert into workout_library. Mirrors athlete
  // createWorkoutLibraryItem() column set, plus required `type`.
  // category is modality from the locked taxonomy (see LOCKED_WORKOUT_CATEGORIES).
  // Separate from type (energy system).
  function createCoachLibraryDrill(token, coachUser, fields){
    var payload = {
      category: fields.category,
      name: fields.name,
      description: fields.description || null,
      created_by: coachUser.id,
      type: fields.type
    };
    return fetch(SB_URL + '/rest/v1/workout_library', {
      method: 'POST',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify(payload)
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      return res.json().then(function(rows){
        return Array.isArray(rows) ? rows[0] : rows;
      });
    });
  }

  // Coach-side assignment insert. Same library_item_id link athlete
  // addLibraryItemToTraining() writes, with coach_id set.
  function createCoachLibraryAssignment(token, payload){
    return fetch(SB_URL + '/rest/v1/assignments', {
      method: 'POST',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify(payload)
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      return res.json().then(function(rows){
        return Array.isArray(rows) ? rows[0] : rows;
      });
    });
  }

  // Locked workout-library category taxonomy (coach create path).
  // Free-text categories are rejected — invalid values like "Strength"
  // must not be insertable. Matches the athlete-side taxonomy.
  var LOCKED_WORKOUT_CATEGORIES = [
    'Hangboard',
    'Campus Board',
    'Boulder Circuits',
    'Limit Bouldering',
    'Route Climbing',
    'Core & Antagonist Strength',
    'Flexibility & Mobility',
    'Footwork & Technique',
    'Aerobic Base/Capacity'
  ];

  function isLockedWorkoutCategory(category){
    return LOCKED_WORKOUT_CATEGORIES.indexOf(category) !== -1;
  }

  var _assignWizard = null;
  var _assignWizardCtx = null;

  function resetAssignWizard(){
    _assignWizard = {
      step: 1,
      type: null,
      category: null,
      createMode: false,
      libraryItemId: null,
      drillName: '',
      libraryDescription: '',
      assignDescription: '',
      dueDate: '',
      resourceLink: '',
      libLoadError: null
    };
    _coachLibSelectedId = null;
  }

  function drillsForTypeCategory(type, category){
    return _coachLibCache.filter(function(item){
      return item.type === type && item.category === category;
    });

  function filterWizardLibraryResults(query){
    var q = (query || '').trim().toLowerCase();
    var rows = drillsForTypeCategory(_assignWizard.type, _assignWizard.category);
    if(!q) return rows;
    return rows.filter(function(item){
      var hay = ((item.name || '') + ' ' + (item.description || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });

  function renderWizardLibraryResults(){
    var resultsEl = document.getElementById('new-a-lib-results');

    var rows = filterWizardLibraryResults(searchEl ? searchEl.value : '');

      resultsEl.innerHTML = '<div class="aw-lib-empty">No drills match this search.</div>';
      return;
    }
    resultsEl.innerHTML = rows.map(function(item){
      var selected = item.id === _assignWizard.libraryItemId ? ' selected' : '';
      var snippet = (item.description || '').replace(/\s+/g, ' ').trim();
      if(snippet.length > 100) snippet = snippet.slice(0, 100) + '…';
      return '<button type="button" class="aw-chip' + selected + '" data-id="' + escapeHtml(item.id) + '">' +
        escapeHtml(item.name) +
        (snippet ? '<span class="aw-chip-meta">' + escapeHtml(snippet) + '</span>' : '') +
      '</button>';
    }).join('');

  function renderAssignWizardBody(){
    var body = document.getElementById('wiz-body');
    var msgEl = document.getElementById('new-a-msg');
    if(!body || !_assignWizard) return;
    if(msgEl) msgEl.innerHTML = '';
    setAssignWizardFooter('');

    var step = _assignWizard.step;
    if(step === 1){
      setAssignWizardChrome('Which energy system?', 'Strength, Power, or Endurance — this filters everything that follows.');
      body.innerHTML =
        '<div class="aw-choices">' +
          ['strength', 'power', 'endurance'].map(function(t){
            var sel = _assignWizard.type === t ? ' selected' : '';
            return '<button type="button" class="aw-chip' + sel + '" data-type="' + t + '">' +
              escapeHtml(coachLibTypeLabel(t)) + '</button>';
          }).join('') +
        '</div>';
      Array.prototype.forEach.call(body.querySelectorAll('.aw-chip'), function(btn){
        btn.addEventListener('click', function(){
          _assignWizard.type = btn.getAttribute('data-type');
          _assignWizard.category = null;
          _assignWizard.createMode = false;
          _assignWizard.libraryItemId = null;
          _assignWizard.drillName = '';
          _assignWizard.libraryDescription = '';
          _assignWizard.assignDescription = '';
          _coachLibSelectedId = null;
          goAssignWizardStep(2);
        });
      });
      return;
    }

    if(step === 2){
      // Locked taxonomy only — never surface free-text / legacy categories.
      setAssignWizardChrome('Which category?', 'Only the locked training taxonomy. Empty categories open a create form next.');
      body.innerHTML =
        wizardPathSummaryHtml() +
        '<div class="aw-choices">' +
          LOCKED_WORKOUT_CATEGORIES.map(function(c){
            var count = drillsForTypeCategory(_assignWizard.type, c).length;
            var meta = count
              ? count + (count === 1 ? ' drill' : ' drills')
              : 'No drills yet — you\'ll create one';
            var sel = _assignWizard.category === c ? ' selected' : '';
            return '<button type="button" class="aw-chip' + sel + '" data-category="' + escapeHtml(c) + '">' +
              escapeHtml(c) +
              '<span class="aw-chip-meta">' + meta + '</span></button>';
          }).join('') +
        '</div>';
      setAssignWizardFooter('<button type="button" class="aw-secondary-btn" id="wiz-back">← Back</button>');
      document.getElementById('wiz-back').addEventListener('click', function(){
        goAssignWizardStep(1);
      });
      Array.prototype.forEach.call(body.querySelectorAll('.aw-chip'), function(btn){
        btn.addEventListener('click', function(){
          var cat = btn.getAttribute('data-category');
          if(!isLockedWorkoutCategory(cat)) return;
          _assignWizard.category = cat;
          _assignWizard.libraryItemId = null;
          _assignWizard.drillName = '';
          _assignWizard.libraryDescription = '';
          _assignWizard.assignDescription = '';
          _coachLibSelectedId = null;
          _assignWizard.createMode = drillsForTypeCategory(_assignWizard.type, _assignWizard.category).length === 0;
          goAssignWizardStep(3);
        });
      });
      return;
    }

    if(step === 3){
      if(_assignWizard.createMode){
        setAssignWizardChrome('Create a new drill', 'Saves to the shared library under this type and category, then assigns it.');
        body.innerHTML =
          wizardPathSummaryHtml() +
          '<div class="aw-field"><label>Category *</label>' +
            '<div class="aw-choices" id="new-a-category-chips">' +
              LOCKED_WORKOUT_CATEGORIES.map(function(c){
                var sel = c === _assignWizard.category ? ' selected' : '';
                return '<button type="button" class="aw-chip' + sel + '" data-category="' + escapeHtml(c) + '">' +
                  escapeHtml(c) + '</button>';
              }).join('') +
            '</div></div>' +
          '<div class="aw-field"><label for="new-a-name">Name *</label>' +
            '<input id="new-a-name" type="text" placeholder="e.g. Repeaters" value="' +
            escapeHtml(_assignWizard.drillName) + '"></div>' +
          '<div class="aw-field"><label for="new-a-lib-desc">Description</label>' +
            '<textarea id="new-a-lib-desc" placeholder="Optional protocol details">' +
            escapeHtml(_assignWizard.libraryDescription) + '</textarea></div>';
        Array.prototype.forEach.call(body.querySelectorAll('#new-a-category-chips .aw-chip'), function(btn){
          btn.addEventListener('click', function(){
            var cat = btn.getAttribute('data-category');
            if(!isLockedWorkoutCategory(cat)) return;
            _assignWizard.category = cat;
            Array.prototype.forEach.call(body.querySelectorAll('#new-a-category-chips .aw-chip'), function(b){
              b.classList.toggle('selected', b === btn);
            });
          });
        });
        setAssignWizardFooter(
          '<button type="button" class="aw-next" id="wiz-next">Next →</button>' +
          '<button type="button" class="aw-secondary-btn" id="wiz-back">← Back</button>'
        );
        document.getElementById('wiz-back').addEventListener('click', function(){
          var hasDrills = drillsForTypeCategory(_assignWizard.type, _assignWizard.category).length > 0;
          if(hasDrills){
            _assignWizard.createMode = false;
            goAssignWizardStep(3);
          } else {
            goAssignWizardStep(2);
          }
        });
        document.getElementById('wiz-next').addEventListener('click', function(){
          var category = _assignWizard.category;
          var name = (document.getElementById('new-a-name').value || '').trim();
          var libDesc = (document.getElementById('new-a-lib-desc').value || '').trim();
          if(!isLockedWorkoutCategory(category)){
            document.getElementById('new-a-msg').innerHTML =
              '<div class="form-error">Pick a category from the list.</div>';
            return;
          }
          if(!name){
            document.getElementById('new-a-msg').innerHTML =
              '<div class="form-error">Name is required.</div>';
            return;
          }
          _assignWizard.libraryItemId = null;
          _coachLibSelectedId = null;
          _assignWizard.category = category;
          _assignWizard.drillName = name;
          _assignWizard.libraryDescription = libDesc;
          _assignWizard.assignDescription = libDesc;
          goAssignWizardStep(4);
        });
        return;
      }

      // Pick from existing drills for this type + category only.
      setAssignWizardChrome('Pick a drill', 'Only drills matching the energy system and category you chose.');
      body.innerHTML =
        wizardPathSummaryHtml() +
        '<div class="aw-field"><label for="new-a-lib-search">Search</label>' +
          '<input id="new-a-lib-search" type="text" placeholder="Filter by name"></div>' +
        '<div id="new-a-lib-results" class="aw-lib-results"></div>' +
        '<button type="button" class="aw-linkish" id="wiz-create-instead">Or create a new drill</button>';
      renderWizardLibraryResults();
      document.getElementById('new-a-lib-search').addEventListener('input', renderWizardLibraryResults);
      document.getElementById('new-a-lib-results').addEventListener('click', function(e){
        var btn = e.target.closest('.aw-chip');
        if(!btn) return;
        var id = btn.getAttribute('data-id');
        var item = _coachLibCache.find(function(r){ return r.id === id; });
        if(!item) return;
        if(item.type !== _assignWizard.type || item.category !== _assignWizard.category) return;
        _assignWizard.libraryItemId = item.id;
        _coachLibSelectedId = item.id;
        _assignWizard.drillName = item.name || '';
        _assignWizard.libraryDescription = item.description || '';
        _assignWizard.assignDescription = item.description || '';
        _assignWizard.createMode = false;
        goAssignWizardStep(4);
      });
      document.getElementById('wiz-create-instead').addEventListener('click', function(){
        _assignWizard.createMode = true;
        _assignWizard.libraryItemId = null;
        _coachLibSelectedId = null;
        _assignWizard.drillName = '';
        _assignWizard.libraryDescription = '';
        _assignWizard.assignDescription = '';
        goAssignWizardStep(3);
      });
      setAssignWizardFooter('<button type="button" class="aw-secondary-btn" id="wiz-back">← Back</button>');
      document.getElementById('wiz-back').addEventListener('click', function(){
        goAssignWizardStep(2);
      });
      return;
    }

    if(step === 4){
      setAssignWizardChrome('Customize for this athlete', 'Edit reps, sets, weight, or notes. Plain text / markdown.');
      body.innerHTML =
        wizardPathSummaryHtml() +
        '<div class="aw-field"><label for="new-a-desc">Description</label>' +
          '<textarea id="new-a-desc" placeholder="Optional — tailor the protocol for this athlete">' +
          escapeHtml(_assignWizard.assignDescription) + '</textarea></div>';
      setAssignWizardFooter(
        '<button type="button" class="aw-next" id="wiz-next">Next →</button>' +
        '<button type="button" class="aw-secondary-btn" id="wiz-back">← Back</button>'
      );
      document.getElementById('wiz-back').addEventListener('click', function(){
        _assignWizard.assignDescription = document.getElementById('new-a-desc').value || '';
        goAssignWizardStep(3);
      });
      document.getElementById('wiz-next').addEventListener('click', function(){
        _assignWizard.assignDescription = document.getElementById('new-a-desc').value || '';
        goAssignWizardStep(5);
      });
      return;
    }

    // Step 5 — due date / resource link
    setAssignWizardChrome('Due date & resource', 'Optional schedule and a link to a video or doc.');
    body.innerHTML =
      wizardPathSummaryHtml() +
      '<div class="aw-field"><label for="new-a-due">Due date</label>' +
        '<input id="new-a-due" type="date" value="' + escapeHtml(_assignWizard.dueDate) + '"></div>' +
      '<div class="aw-field"><label for="new-a-link">Resource link</label>' +
        '<input id="new-a-link" type="url" placeholder="Optional — YouTube, Google Drive, etc." value="' +
        escapeHtml(_assignWizard.resourceLink) + '"></div>';
    setAssignWizardFooter(
      '<button type="button" class="aw-next" id="new-a-submit">Create assignment</button>' +
      '<button type="button" class="aw-secondary-btn" id="wiz-back">← Back</button>'
    );
    document.getElementById('wiz-back').addEventListener('click', function(){
      _assignWizard.dueDate = document.getElementById('new-a-due').value || '';
      _assignWizard.resourceLink = document.getElementById('new-a-link').value || '';
      goAssignWizardStep(4);
    });
    document.getElementById('new-a-submit').addEventListener('click', submitAssignWizard);
  }

  function submitAssignWizard(){
    var ctx = _assignWizardCtx;
    if(!ctx || !_assignWizard) return;
    var token = ctx.token;
    var coachUser = ctx.coachUser;
    var athleteId = ctx.athleteId;
    var msgEl = document.getElementById('new-a-msg');
    var btn = document.getElementById('new-a-submit');
    var dueInput = document.getElementById('new-a-due');
    var linkInput = document.getElementById('new-a-link');
    var due = dueInput ? dueInput.value : '';
    var link = linkInput ? linkInput.value.trim() : '';
    _assignWizard.dueDate = due;
    _assignWizard.resourceLink = link;

    if(!_assignWizard.type || !_assignWizard.category || !_assignWizard.drillName){
      msgEl.innerHTML = '<div class="form-error">Wizard is incomplete — go back and finish each step.</div>';
      return;
    }
    if(!isLockedWorkoutCategory(_assignWizard.category)){
      msgEl.innerHTML = '<div class="form-error">Category must be one of the locked taxonomy values.</div>';
      return;
    }
    if(link && !/^https?:\/\//i.test(link)){
      msgEl.innerHTML = '<div class="form-error">Resource link must start with http:// or https://</div>';
      return;
    }

    var assignDescription = (_assignWizard.assignDescription || '').trim() || null;

    function finishSuccess(){
      if(btn){
        btn.disabled = false;
        btn.textContent = 'Create assignment';
      }
      loadAssignments(token, coachUser, athleteId);
      loadCoachWorkoutLibrary(token).then(function(rows){
        _coachLibCache = Array.isArray(rows) ? rows : [];
      }).catch(function(){ /* non-blocking */ });
      closeAssignWizardOverlay();
      resetAssignWizard();
      showAssignSavedBanner();
    }

    function failCreate(err){
      if(btn){
        btn.disabled = false;
        btn.textContent = 'Create assignment';
      }
      var isMissingColumn = err && (err.code === 'PGRST204' || err.code === '42703');
      var msg = (err && err.message) || 'unknown error';
      msgEl.innerHTML = '<div class="form-error">' +
        (isMissingColumn
          ? 'A required column is missing in Supabase (resource_link or library_item_id / type). Check recent migrations.'
          : 'Failed. ' + escapeHtml(msg)) +
        '</div>';
    }

    if(btn){
      btn.disabled = true;
      btn.textContent = 'Creating...';
    }

    // Existing library drill — link only, no re-insert.
    if(_assignWizard.libraryItemId && !_assignWizard.createMode){
      var assignPayload = {
        coach_id: coachUser.id,
        athlete_id: athleteId,
        title: _assignWizard.drillName,
        description: assignDescription,
        due_date: due || null,
        library_item_id: _assignWizard.libraryItemId
      };
      if(link) assignPayload.resource_link = link;
      createCoachLibraryAssignment(token, assignPayload).then(finishSuccess).catch(failCreate);
      return;
    }

    // Brand-new drill: insert into workout_library first (type/category
    // locked from steps 1–2), then assign via library_item_id.
    createCoachLibraryDrill(token, coachUser, {
      category: _assignWizard.category,
      name: _assignWizard.drillName,
      description: (_assignWizard.libraryDescription || '').trim() || null,
      type: _assignWizard.type
    }).then(function(libRow){
      if(!libRow || !libRow.id) throw { message: 'Library insert returned no id' };
      var payload = {
        coach_id: coachUser.id,
        athlete_id: athleteId,
        title: _assignWizard.drillName,
        description: assignDescription,
        due_date: due || null,
        library_item_id: libRow.id
      };
      if(link) payload.resource_link = link;
      return createCoachLibraryAssignment(token, payload);
    }).then(finishSuccess).catch(failCreate);
  }

  function startAssignWizard(){

    resetAssignWizard();

    setAssignWizardChrome('Loading library…', 'Pulling drills for this coach.');

        body.innerHTML = '<div class="form-error">' + escapeHtml(_assignWizard.libLoadError) + '</div>';

      setAssignWizardFooter('<button type="button" class="aw-secondary-btn" id="aw-close-err">← Close</button>');

      .then(function(rows){

          return _lastSessionRows;

          _lastSessionRows.map(function(s){
            return '<div class="assign-card">' +
              '<div class="assign-meta">' +
                '<span class="assign-due">' + fmtDate(s.created_at) + '</span>' +
                '<span>' + escapeHtml(s.route_name || '—') + ' · ' + escapeHtml(s.zone || '—') + '</span>' +
              '</div>' +
            '</div>';

  function renderNotesSection(token, coachUser, athleteId, waitingForSessions){
    var el = document.getElementById('detail-notes');
    el.innerHTML =
      '<div class="panel-title">Coach notes</div>' +
      '<div id="notes-list"><div class="form-note">Loading···</div></div>' +
      '<div class="form-row" style="margin-top:14px;"><label for="new-note-session">Session</label>' +
        '<select id="new-note-session"' + (waitingForSessions ? ' disabled' : '') + '>' +
          '<option value="">' + (waitingForSessions ? 'Loading sessions···' : 'Select a session···') + '</option>' +
        '</select></div>' +
      '<div class="form-row"><label for="new-note-text">Note</label><textarea id="new-note-text" placeholder="Free-text note attached to the session above"></textarea></div>' +
      '<div class="form-actions"><button class="btn-primary" id="new-note-submit">Save note</button></div>' +
      '<div id="new-note-msg"></div>';

    if(!waitingForSessions) populateNotesSessionSelect();

    loadNotes(token, coachUser, athleteId);

    var sessionSelect = document.getElementById('new-note-session');
    document.getElementById('new-note-submit').addEventListener('click', function(){
      var msgEl = document.getElementById('new-note-msg');
      var noteText = document.getElementById('new-note-text').value.trim();
      var sessionId = sessionSelect.value;
      if(!sessionId){
        msgEl.innerHTML = '<div class="form-error">Pick a session first.</div>';
        return;
      }
      if(!noteText){
        msgEl.innerHTML = '<div class="form-error">Note text is required.</div>';
        return;
      }
      var payload = {
        coach_id: coachUser.id,
        athlete_id: athleteId,
        session_id: sessionId,
        note: noteText
      };
      var btn = document.getElementById('new-note-submit');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      fetch(SB_URL + '/rest/v1/coach_notes', {
        method: 'POST',
        headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
        body: JSON.stringify(payload)
      }).then(function(res){
        btn.disabled = false;
        btn.textContent = 'Save note';
        if(!res.ok){
          return res.json().then(function(err){ throw err; });
        }
        document.getElementById('new-note-text').value = '';
        msgEl.innerHTML = '<div class="form-success">Note saved.</div>';
        loadNotes(token, coachUser, athleteId);
      }).catch(function(err){
        btn.disabled = false;
        btn.textContent = 'Save note';
        var isMissingTable = err && (err.code === 'PGRST205' || err.code === '42P01');
        msgEl.innerHTML = '<div class="form-error">' +
          (isMissingTable
            ? 'The <code>coach_notes</code> table doesn\'t exist yet — run coach-layer-additions.sql (section 2) first.'
            : 'Failed — ' + escapeHtml(err.message || 'unknown error')) +
          '</div>';
      });
    });
  }

  function loadNotes(token, coachUser, athleteId){

      .then(function(rows){

            '<div class="note-meta mono">' + fmtDate(n.created_at) + ' — session ' + shortId(n.session_id) + '</div>' +
            '<div class="note-text">' + escapeHtml(n.note) + '</div>' +
          '</div>';
        }).join('');
      })
      .catch(function(err){
        var isMissingTable = err && (err.code === 'PGRST205' || err.code === '42P01');
        listEl.innerHTML = '<div class="form-note">' +
          (isMissingTable
            ? 'The <code>coach_notes</code> table doesn\'t exist yet — see coach-layer-additions.sql.'
            : 'Failed to load notes — ' + escapeHtml(err.message || 'unknown error')) +
          '</div>';
      });
  }

  function markComplete(token, user, assignmentId, btn){
    btn.disabled = true;
    btn.textContent = 'Saving...';
    // Deliberately sends ONLY completed_at — assignments' athlete-side RLS
    // currently allows updating any column, not just this one, so the app
    // itself is the only thing enforcing that an athlete can't touch title/
    // description/due_date/coach_id via this action.
    fetch(SB_URL + '/rest/v1/assignments?id=eq.' + assignmentId + '&athlete_id=eq.' + user.id, {
      method: 'PATCH',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ completed_at: new Date().toISOString() })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      loadAthleteAssignments(token, user);
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = 'Mark complete';
      alert('Failed to mark complete — ' + (err && err.message ? err.message : 'unknown error'));
    });
  }

})();
</script>
</body>
</html>
