<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Straydog Labs — Coaching</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 48'%3E%3Crect x='8' y='4' width='24' height='40' rx='12' fill='none' stroke='%23e89252' stroke-width='4'/%3E%3Crect x='4' y='16' width='8' height='16' rx='3' fill='none' stroke='%23e89252' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8763a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* Dark grey (not near-black). Surface stays one step lighter than bg;
       border steps up again so panels/chips still edge-define. */
    --bg:#2e2e2e;
    --surface:#3a3a3a;
    --border:#4a4a4a;
    --text:#f0f0f0;
    /* Brighter than old #999 — keeps AA on the lighter --surface */
    --text-secondary:#a8a8a8;
    /* Accent/danger lifted with the bg so links + error copy stay readable */
    --accent:#e89252;
    --success:#3B6D11;
    --warning:#BA7517;
    --danger:#ef8575;
    /* Activation bands — same tokens as athlete app / Foundash zone bars */
    --comfort:#7ec87a;
    --learning:#f5a623;
    --panic:#e84444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  a{color:var(--accent);}

  /* ---------- Login screen ---------- */
  #login{
    position:fixed;inset:0;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;
    padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #login.hidden{display:none;}
  .login-box{width:340px;}
  .login-word{
    font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    text-align:center;margin-bottom:4px;
  }
  .login-word span{color:var(--accent);}
  .login-sub{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-secondary);text-align:center;margin-bottom:32px;
  }
  .login-field{margin-bottom:12px;}
  .login-field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.04em;}
  .login-field input{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;color:var(--text);font-family:'Space Mono',monospace;font-size:14px;outline:none;
  }
  .login-field input:focus{border-color:var(--accent);}
  .login-field input.shake{animation:shake .35s;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }
  #login-btn{
    width:100%;margin-top:8px;background:var(--accent);border:none;border-radius:8px;
    padding:12px 14px;color:#0d0d0d;font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:14px;cursor:pointer;
  }
  #login-btn:hover{opacity:.9;}
  #login-btn:disabled{opacity:.5;cursor:default;}
  #login-error{margin-top:14px;font-size:12px;color:var(--danger);min-height:16px;text-align:center;}

  /* ---------- Shell ---------- */
  #app{display:none;min-height:100vh;}
  #app.visible{display:block;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    /* Keep 16px content padding below the iPhone status bar in standalone
       (viewport-fit=cover + black-translucent). env() is 0 on desktop. */
    padding:calc(16px + env(safe-area-inset-top, 0px)) 32px 16px;
    border-bottom:1px solid var(--border);background:var(--surface);
  }
  .topbar-word{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .topbar-word span{color:var(--accent);}
  .topbar-right{display:flex;align-items:center;gap:16px;font-size:12.5px;color:var(--text-secondary);}
  #signout-btn{
    background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;
    color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:12.5px;cursor:pointer;
  }
  #signout-btn:hover{border-color:var(--accent);color:var(--accent);}
  #personal-dash-btn{
    background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;
    color:var(--accent);font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  #personal-dash-btn:hover{border-color:var(--accent);background:rgba(232,146,82,.08);}

  #main{max-width:1100px;margin:0 auto;padding:32px 24px calc(60px + env(safe-area-inset-bottom, 0px));}
  .page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--text-secondary);margin-bottom:28px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 24px;}
  .panel-title{
    font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-secondary);margin-bottom:14px;
  }
  .stub{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:40px 24px;text-align:center;color:var(--text-secondary);font-size:13px;line-height:1.6;
  }
  .stub b{color:var(--text);}
  .stub code{
    background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;
    font-family:'Space Mono',monospace;font-size:11.5px;color:var(--accent);
  }

  /* ---------- Coach: roster + detail ---------- */
  .coach-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;}
  .roster-row{
    display:flex;align-items:stretch;justify-content:space-between;gap:12px;
    background:var(--bg);border:1px solid var(--border);border-radius:16px;
    padding:16px 14px;margin-bottom:10px;cursor:pointer;min-height:88px;
    text-align:left;color:var(--text);-webkit-tap-highlight-color:transparent;
  }
  .roster-row:last-child{margin-bottom:0;}
  .roster-row:hover{border-color:rgba(232,146,82,.45);}
  .roster-row:active{transform:scale(.98);}
  .roster-row.active{border-color:var(--accent);background:rgba(232,146,82,.1);}
  .roster-name{font-size:16px;font-weight:700;line-height:1.25;}
  .roster-meta{font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4;}
  .roster-empty{font-size:13px;color:var(--text-secondary);padding:12px 4px;}
  .roster-unread-dot{
    width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;
    border:1px solid var(--surface);pointer-events:none;
  }
  .roster-unread-dot[hidden]{display:none;}
  .roster-assign-btn{
    background:transparent;border:1px solid var(--border);border-radius:8px;
    padding:7px 12px;color:var(--accent);font-family:'Space Grotesk',sans-serif;
    font-size:12px;font-weight:700;cursor:pointer;line-height:1.2;
  }
  .roster-assign-btn:hover{border-color:var(--accent);background:rgba(232,146,82,.08);}

  .detail-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .detail-title{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;}
  .detail-sub{font-size:13px;color:var(--text-secondary);margin-top:4px;}
  .detail-section{margin-bottom:20px;}
  .detail-section:last-child{margin-bottom:0;}
  .detail-back{
    background:none;border:none;color:var(--text-secondary);font-family:'Space Grotesk',sans-serif;
    font-size:14px;font-weight:600;cursor:pointer;padding:4px 0 12px;
  }
  .detail-back:hover{color:var(--text);}
  .see-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .see-card{
    background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:16px 14px;
    cursor:pointer;text-align:left;color:var(--text);font-family:'Space Grotesk',sans-serif;
    -webkit-tap-highlight-color:transparent;min-height:104px;
    display:flex;flex-direction:column;justify-content:space-between;width:100%;
  }
  .see-card:hover{border-color:rgba(232,146,82,.45);}
  .see-card:active{transform:scale(.98);}
  .see-card.wide{grid-column:1 / -1;}
  .see-card .te-label{
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px;
  }
  .see-card .te-title{font-size:16px;font-weight:700;line-height:1.25;}
  .see-card .te-sub{font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.4;}
  .see-card .te-unread{
    width:9px;height:9px;border-radius:50%;background:var(--accent);
    border:1px solid var(--bg);display:none;flex-shrink:0;
  }
  .see-card .te-unread.on{display:inline-block;}
  .athlete-zone-wrap{margin-top:4px;margin-bottom:4px;}

  .assign-card{
    background:var(--bg);border:1px solid var(--border);border-radius:16px;
    padding:16px 16px;margin-bottom:10px;
  }
  .assign-card:last-child{margin-bottom:0;}
  .assign-card.done{opacity:.55;}
  .assign-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .assign-title{font-size:15px;font-weight:700;margin-bottom:0;}
  .assign-progress{
    font-size:11px;font-weight:700;color:var(--text-secondary);
    font-family:'Space Mono',monospace;white-space:nowrap;flex-shrink:0;
  }
  .assign-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px;}
  .assign-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-secondary);}
  .assign-dates{display:flex;flex-direction:column;gap:3px;}
  .assign-due{font-family:'Space Mono',monospace;}
  .assign-due.overdue{color:var(--danger);}
  .assign-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .assign-complete-btn{
    background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 12px;
    color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .assign-complete-btn:hover{border-color:var(--success);color:#7fbf3f;}
  .assign-complete-btn:disabled{opacity:.5;cursor:default;}
  .assign-edit-btn,
  .assign-repeat-btn{
    background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 12px;
    color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .assign-edit-btn:hover,
  .assign-repeat-btn:hover{border-color:var(--accent);color:var(--accent);}
  .assign-edit-btn:disabled,
  .assign-repeat-btn:disabled{opacity:.5;cursor:default;}
  .assign-delete-btn{
    background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 12px;
    color:var(--text-secondary);font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .assign-delete-btn:hover{border-color:var(--danger);color:var(--danger);}
  .assign-delete-btn:disabled{opacity:.5;cursor:default;}
  .assign-done-tag{font-size:11px;font-weight:700;color:#7fbf3f;}

  .goal-block-label{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-secondary);margin:12px 0 4px;
  }
  .goal-list .goal-block-label:first-child{margin-top:0;}
  .goal-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .goal-list .goal-row:last-child{border-bottom:none;}
  .goal-row-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .goal-text{font-size:13.5px;line-height:1.45;}
  .goal-caption{font-size:11px;color:var(--text-secondary);margin-top:3px;}
  .goal-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .goal-pri-toggle{display:flex;gap:8px;margin:8px 0;}
  .goal-pri-btn{
    background:transparent;border:1px solid var(--border);border-radius:6px;
    padding:6px 12px;color:var(--text);font-family:'Space Grotesk',sans-serif;
    font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .goal-pri-btn.selected{border-color:var(--accent);color:var(--accent);}
  .goal-add{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .goal-add-label{
    font-size:11.5px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;
  }
  .baseline-row{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--border);
  }
  .baseline-row:last-child{border-bottom:none;}
  .baseline-terrain{font-size:13px;font-weight:600;margin-bottom:2px;}
  .baseline-expect{font-size:12.5px;color:var(--text-secondary);line-height:1.45;}
  .baseline-calibrated{
    font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:#7fbf3f;flex-shrink:0;padding:3px 7px;
    border:1px solid rgba(127,191,63,.35);border-radius:6px;
  }

  .roster-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .roster-insights{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .roster-stat{
    background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:16px 14px;
    min-height:72px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .roster-insights .roster-stat{padding:14px 12px;min-height:68px;}
  .roster-stat-val{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.02em;}
  .roster-insights .roster-stat-val{font-size:18px;}
  .roster-stat-val.flagged{color:var(--panic);}
  .roster-stat-label{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-secondary);margin-top:6px;
  }
  .team-zone-wrap{margin-bottom:14px;}
  .team-zone-label{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-secondary);margin-bottom:8px;
  }
  .team-zone-note{font-size:11px;color:var(--text-secondary);line-height:1.45;margin-top:8px;}
  .zone-bar-track{
    display:flex;height:14px;border-radius:7px;overflow:hidden;
    background:var(--bg);border:1px solid var(--border);
  }
  .zone-bar-seg{height:100%;min-width:0;}
  .zone-bar-seg.zone-comfort{background:var(--comfort);}
  .zone-bar-seg.zone-learning{background:var(--learning);}
  .zone-bar-seg.zone-panic{background:var(--panic);}
  .zone-bar-empty{font-size:12px;color:var(--text-secondary);padding:4px 0;}
  .zone-bar-legend{
    display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11.5px;color:var(--text-secondary);margin-top:8px;
  }
  .zone-bar-legend .zone-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;
  }
  .zone-dot.comfort{background:var(--comfort);}
  .zone-dot.learning{background:var(--learning);}
  .zone-dot.panic{background:var(--panic);}
  .roster-row-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;}
  .roster-label{
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px;
  }
  .roster-row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .athlete-zone-mini .zone-bar-track{height:6px;width:56px;border-radius:3px;border:none;}
  .athlete-panic-flag{
    font-size:10.5px;font-weight:700;color:var(--panic);line-height:1.3;text-align:right;max-width:120px;
  }
  .roster-row.flagged{background:rgba(232,68,68,.06);}
  .roster-row.flagged.active{background:rgba(232,146,82,.1);}

  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:11.5px;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.03em;}
  .form-row input, .form-row textarea, .form-row select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;
    padding:9px 11px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus{border-color:var(--accent);}
  .form-row textarea{resize:vertical;min-height:60px;font-family:'Space Grotesk',sans-serif;}
  .form-actions{display:flex;gap:8px;align-items:center;}
  .btn-primary{
    background:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:9px 18px;
    color:#0d0d0d;font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .btn-primary:hover{opacity:.9;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .form-note{font-size:11.5px;color:var(--text-secondary);margin-top:8px;}
  .form-error{font-size:11.5px;color:var(--danger);margin-top:8px;}
  .form-success{font-size:11.5px;color:#7fbf3f;margin-top:8px;}

  .note-card{
    background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;
  }
  .note-card:last-child{margin-bottom:0;}
  .note-meta{font-size:11px;color:var(--text-secondary);margin-bottom:5px;}
  .note-text{font-size:13px;line-height:1.5;}

  .journal-entry{
    background:var(--bg);border:1px solid var(--border);border-radius:16px;
    padding:16px 16px;margin-bottom:12px;
  }
  .journal-entry:last-child{margin-bottom:0;}
  .journal-head{
    display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;
    margin-bottom:10px;
  }
  .journal-route{font-size:13.5px;font-weight:600;}
  .journal-when{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--text-secondary);}
  .journal-zone{font-size:11.5px;font-weight:700;}
  .journal-zone.comfort{color:var(--comfort);}
  .journal-zone.learning{color:var(--learning);}
  .journal-zone.panic{color:var(--panic);}
  .journal-field{margin-bottom:10px;}
  .journal-field-label{
    font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-secondary);margin-bottom:2px;
  }
  .journal-field-body{font-size:13px;line-height:1.5;word-break:break-word;}
  .journal-somatics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .journal-soma{
    font-size:11.5px;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:4px 8px;color:var(--text-secondary);
  }
  .journal-soma b{color:var(--text);font-weight:600;}
  .journal-empty-refl{font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;}
  .journal-notes{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .journal-notes-label{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-secondary);margin-bottom:10px;
  }
  .journal-note{margin-bottom:10px;}
  .journal-note:last-child{margin-bottom:0;}
  .journal-note.mine .note-meta .note-who{color:var(--accent);}
  .journal-note .note-who{font-weight:700;color:var(--text);}
  .journal-reply{margin-top:10px;}
  .journal-reply textarea{
    width:100%;min-height:56px;resize:vertical;background:var(--surface);
    border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);
    font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none;margin-bottom:8px;
  }
  .journal-reply textarea:focus{border-color:var(--accent);}

  /* ---------- Coach ↔ athlete chat ---------- */
  .chat-thread{
    max-height:min(62vh,520px);overflow-y:auto;background:var(--bg);border:1px solid var(--border);
    border-radius:16px;padding:14px;margin-bottom:12px;
    display:flex;flex-direction:column;
  }
  .chat-empty{font-size:12.5px;color:var(--text-secondary);padding:8px 2px;}

<script>
(function(){
  'use strict';

  var SB_URL = 'https://kwtbqgoqtewrlsjgepwq.supabase.co';

  var supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);

  function sbHeaders(token){
    return {
      'Content-Type': 'application/json',
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + (token || SB_KEY)
    };
  }

  function sbSelect(token, table, query){
    return fetch(SB_URL + '/rest/v1/' + table + '?' + query, { headers: sbHeaders(token) })
      .then(function(res){
        if(!res.ok) return res.json().then(function(err){ throw err; });
        return res.json();
      });
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtDate(d){
    if(!d) return '—';
    // Date-only strings (due_date, "YYYY-MM-DD") must NOT go through `new
    // Date(str)` — that parses as UTC midnight, which then renders as the
    // previous day in any timezone behind UTC. Build the Date from local
    // parts instead. Full timestamps (created_at/completed_at) are fine as-is.
    var dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(d);
    var dt = dateOnly ? new Date(d + 'T00:00:00') : new Date(d);
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  }

  function shortId(id){
    return id ? id.slice(0, 8) : '—';
  }

  // Only render resource_link as a clickable href if it's actually http(s) —
  // defends against a javascript:-scheme (or similar) value ending up in an
  // anchor href, however it got into the field.
  function safeUrl(u){
    if(!u) return null;
    return /^https?:\/\//i.test(u.trim()) ? u.trim() : null;
  }

  // Auto-linkify http(s) URLs inside already-escaped chat body text.
  // Never promotes any other scheme (javascript:, data:, etc.).
  function linkifyHttpText(text){
    var escaped = escapeHtml(text == null ? '' : text);
    return escaped.replace(/https?:\/\/[^\s<]+/gi, function(raw){
      var url = raw;
      var trail = '';
      while(/[.,);:!?]$/.test(url)){
        trail = url.slice(-1) + trail;
        url = url.slice(0, -1);
      }
      // safeUrl expects unescaped input; undo &amp; only for the check/href.
      var hrefCandidate = url.replace(/&amp;/g, '&');
      if(!safeUrl(hrefCandidate)) return raw;
      return '<a href="' + escapeHtml(hrefCandidate) + '" target="_blank" rel="noopener">' +
        url + '</a>' + trail;
    });
  }

  function fmtChatTime(d){
    if(!d) return '—';
    var dt = new Date(d);
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleString('en-US', {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  }

  function assignResourceHtml(a){
    if(!a.resource_link) return '';
    var url = safeUrl(a.resource_link);
    return '<div class="assign-resource">' +
      (url
        ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">Resource link →</a>'
        : '<span>' + escapeHtml(a.resource_link) + '</span>') +
      '</div>';
  }

  // Same counter as athlete Train (countMarkdownCheckboxes in index.html).
  // Read-only here; athletes toggle checkboxes on their side.
  function countMarkdownCheckboxes(text){
    var lines = String(text || '').split('\n');
    var total = 0;
    var checked = 0;
    for(var i=0;i<lines.length;i++){
      var m = lines[i].match(/^(\s*[-*+]\s+)\[( |x|X)\](.*)$/);
      if(m){
        total++;
        if(m[2] === 'x' || m[2] === 'X') checked++;
      }
    }
    return { checked: checked, total: total };
  }

  // Shared card markup for both the coach-side assignment list and the
  // athlete Train tab. Coach cards get Edit / Delete / Repeat; athlete
  // cards get Mark complete.
  function assignCardHtml(a, withCompleteButton, withRepeatButton){
    var done = !!a.completed_at;
    var idAttr = escapeHtml(a.id);
    var actions = '';
    if(done){
      actions = '<span class="assign-done-tag">✓ Completed ' + fmtDate(a.completed_at) + '</span>';
    } else if(withCompleteButton){
      actions = '<button type="button" class="assign-complete-btn" data-id="' + idAttr + '">Mark complete</button>';
    } else if(withRepeatButton){
      // Coach open card — Edit replaces the old inert "Open" span.
      actions = '<button type="button" class="assign-edit-btn" data-id="' + idAttr + '">Edit</button>';
    }
    if(withRepeatButton){
      actions += '<button type="button" class="assign-delete-btn" data-id="' + idAttr + '">Delete</button>';
      actions += '<button type="button" class="assign-repeat-btn" data-id="' + idAttr + '">Repeat workout</button>';
    }
    var checks = countMarkdownCheckboxes(a.description);
    var checkBadge = checks.total > 0
      ? '<span class="assign-progress">' + checks.checked + '/' + checks.total + ' done</span>'
      : '';
    return '<div class="assign-card' + (done ? ' done' : '') + '"' + (withCompleteButton ? ' data-id="' + idAttr + '"' : '') + '>' +
      '<div class="assign-title-row">' +
        '<div class="assign-title">' + escapeHtml(a.title) + '</div>' +
        checkBadge +
      '</div>' +
      (a.description ? '<div class="assign-desc">' + escapeHtml(a.description) + '</div>' : '') +
      assignResourceHtml(a) +
      '<div class="assign-meta">' +
        '<div class="assign-dates">' +
          '<span class="assign-due">Assigned ' + fmtDate(a.created_at) + '</span>' +
          '<span class="assign-due">Due ' + fmtDate(a.due_date) + '</span>' +
        '</div>' +
        '<div class="assign-actions">' + actions + '</div>' +
      '</div>' +
    '</div>';
  }

  // Locked scope: completed assignments must visually separate from open ones
  // (not just dim in place) — open ones render normally, completed ones drop
  // into a collapsed <details> group below, most-recently-completed first.
  function renderAssignmentGroups(rows, withCompleteButton, withRepeatButton){
    var open = rows.filter(function(a){ return !a.completed_at; });
    var done = rows.filter(function(a){ return !!a.completed_at; }).sort(function(a, b){
      return new Date(b.completed_at) - new Date(a.completed_at);
    });
    var html = open.length
      ? open.map(function(a){ return assignCardHtml(a, withCompleteButton, withRepeatButton); }).join('')
      : '<div class="open-empty">No open assignments.</div>';
    if(done.length){
      html += '<details class="completed-group"><summary>Completed (' + done.length + ')</summary>' +
        done.map(function(a){ return assignCardHtml(a, withCompleteButton, withRepeatButton); }).join('') +
        '</details>';
    }
    return html;
  }

  /* ===================== AUTH ===================== */

  function shakeLogin(msg){
    loginError.textContent = msg;
    [emailInput, passwordInput].forEach(function(el){
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');

  }

  function attemptLogin(){
    var email = emailInput.value.trim();
    var password = passwordInput.value;
    if(!email || !password){ shakeLogin('Email and password required'); return; }
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';
    loginError.textContent = '';
    supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      if(res.error){
        shakeLogin(res.error.message || 'Sign in failed');
        return;
      }
      enterApp(res.data.session);
    }).catch(function(e){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      shakeLogin('Sign in failed — ' + (e && e.message ? e.message : 'unknown error'));
    });
  }

  loginBtn.addEventListener('click', attemptLogin);
  [emailInput, passwordInput].forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter') attemptLogin(); });
  });

  document.getElementById('signout-btn').addEventListener('click', function(){
    supabaseClient.auth.signOut().then(function(){
      appEl.classList.remove('visible');
      loginEl.classList.remove('hidden');
      emailInput.value = '';
      passwordInput.value = '';
      mainEl.innerHTML = '';

  });

    appEl.classList.add('visible');
    whoamiEl.textContent = user.email;

        renderAthleteView(token, user);

  function loadRoster(token, user){
    var listEl = document.getElementById('roster-list');

    // Same rpc POST pattern as link_athlete_by_email — returns
    // { ok: true, roster: [{ link_id, athlete_id, athlete_email,
    //   athlete_first_name, athlete_last_name, status, linked_at }] }
    // scoped to auth.uid(); names/emails aren't on raw coach_athlete_links.
    fetch(SB_URL + '/rest/v1/rpc/coach_list_roster', {
      method: 'POST',
      headers: sbHeaders(token),
      body: JSON.stringify({})
    }).then(function(res){
      return res.json().then(function(body){
        if(!res.ok) throw body;
        return body;
      });
    }).then(function(result){
      if(!result || result.ok !== true){
        var errCode = result && result.error;
        throw { message: errCode ? String(errCode) : 'coach_list_roster returned not-ok' };
      }
      _coachRoster = Array.isArray(result.roster) ? result.roster : [];
      renderRoster(token, user, _coachRoster);

        '<div class="roster-empty" style="color:var(--danger);">' +
          (isMissingFn
            ? 'The <code>coach_list_roster</code> function doesn\'t exist yet.'

        '</div>';

  // Athletes tile = roster length. Sessions tile = exact count of non-deleted
  // sessions for linked athletes via sessions_select_coach RLS.
  function updateRosterStats(token, roster){
    var athletesEl = document.getElementById('stat-athletes');
    var sessionsEl = document.getElementById('stat-sessions');
    if(athletesEl) athletesEl.textContent = String(roster.length);
    if(!sessionsEl) return;
    if(!roster.length){
      sessionsEl.textContent = '0';
      return;
    }
    sessionsEl.textContent = '…';
    countCoachRosterSessions(token, roster.map(function(r){ return r.athlete_id; }))
      .then(function(n){ sessionsEl.textContent = String(n); })
      .catch(function(){ sessionsEl.textContent = '—'; });
  }

  function countCoachRosterSessions(token, athleteIds){
    var ids = (athleteIds || []).filter(Boolean);
    if(!ids.length) return Promise.resolve(0);
    var q = 'select=id&user_id=in.(' + ids.join(',') + ')&is_checkin=eq.false&deleted_at=is.null';
    return fetch(SB_URL + '/rest/v1/sessions?' + q, {
      headers: Object.assign(sbHeaders(token), {
        'Prefer': 'count=exact',
        'Range': '0-0'
      })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      var cr = res.headers.get('content-range') || '';
      var slash = cr.lastIndexOf('/');
      if(slash !== -1){
        var total = cr.slice(slash + 1);
        if(total && total !== '*'){
          var n = parseInt(total, 10);
          if(!isNaN(n)) return n;
        }
      }
      return res.json().then(function(rows){
        return Array.isArray(rows) ? rows.length : 0;
      });
    });
  }

  // ── Team / per-athlete insight visuals (descriptive only) ──
  // sessions.zone: comfort|learning|panic
  // sessions.baseline_zone: sent|fell|dna
  // Scope: is_checkin=false, deleted_at null. No causal language.
  var ZONE_KEYS = ['comfort', 'learning', 'panic'];
  var ZONE_CAP = { comfort: 'Comfort', learning: 'Learning', panic: 'Panic' };
  // 3+ panic sessions in 7 days: high enough to mean a cluster, low enough
  // to surface on a typical weekly log volume without waiting for an extreme.
  var PANIC_WEEK_THRESHOLD = 3;
  var _rosterInsightsByAthlete = {};

  function normalizeZone(z){
    var s = String(z || '').toLowerCase().trim();
    if(s === 'comfort' || s === 'learning' || s === 'panic') return s;
    return null;
  }

  function emptyZoneCounts(){
    return { comfort: 0, learning: 0, panic: 0 };
  }

  function zoneBarSegsHtml(counts, opts){
    opts = opts || {};
    var total = (counts.comfort || 0) + (counts.learning || 0) + (counts.panic || 0);
    if(!total){
      if(opts.compact) return '<div class="zone-bar-track" title="No zone-tagged sessions"></div>';
      return '<div class="zone-bar-empty">No zone-tagged sessions yet</div>';
    }
    return '<div class="zone-bar-track">' + ZONE_KEYS.map(function(z){
      var pct = ((counts[z] || 0) / total) * 100;
      if(pct <= 0) return '';
      return '<div class="zone-bar-seg zone-' + z + '" style="width:' + pct + '%" title="' +
        ZONE_CAP[z] + ' ' + counts[z] + ' (' + Math.round(pct) + '%)"></div>';
    }).join('') + '</div>';
  }

  function zoneBarLegendHtml(counts){
    var total = (counts.comfort || 0) + (counts.learning || 0) + (counts.panic || 0);
    return '<div class="zone-bar-legend">' + ZONE_KEYS.map(function(z){
      var pct = total ? Math.round(((counts[z] || 0) / total) * 100) : 0;
      return '<span><span class="zone-dot ' + z + '"></span>' + ZONE_CAP[z] +
        ' <span class="mono">' + pct + '%</span></span>';
    }).join('') + '</div>';
  }

  function clearRosterInsights(){
    _rosterInsightsByAthlete = {};
    var learningEl = document.getElementById('stat-learning');
    var sendEl = document.getElementById('stat-send');
    var flaggedEl = document.getElementById('stat-flagged');
    var barEl = document.getElementById('team-zone-bar');
    if(learningEl) learningEl.textContent = '—';
    if(sendEl) sendEl.textContent = '—';
    if(flaggedEl){
      flaggedEl.textContent = '—';
      flaggedEl.classList.remove('flagged');
    }
    if(barEl) barEl.innerHTML = '<div class="zone-bar-empty">No athletes linked yet</div>';
  }

  function loadRosterInsights(token, roster){
    var ids = (roster || []).map(function(r){ return r.athlete_id; }).filter(Boolean);
    var learningEl = document.getElementById('stat-learning');
    var sendEl = document.getElementById('stat-send');
    var flaggedEl = document.getElementById('stat-flagged');
    var barEl = document.getElementById('team-zone-bar');
    if(!ids.length){
      clearRosterInsights();
      return Promise.resolve();
    }
    if(learningEl) learningEl.textContent = '…';
    if(sendEl) sendEl.textContent = '…';
    if(flaggedEl) flaggedEl.textContent = '…';
    if(barEl) barEl.innerHTML = '<div class="zone-bar-empty">Loading···</div>';

    return sbSelect(
      token,
      'sessions',
      'select=id,user_id,zone,baseline_zone,created_at' +
        '&user_id=in.(' + ids.join(',') + ')' +
        '&is_checkin=eq.false&deleted_at=is.null&order=created_at.desc&limit=2000'
    ).then(function(rows){
      applyRosterInsights(Array.isArray(rows) ? rows : [], roster);
    }).catch(function(){
      if(learningEl) learningEl.textContent = '—';
      if(sendEl) sendEl.textContent = '—';
      if(flaggedEl){
        flaggedEl.textContent = '—';
        flaggedEl.classList.remove('flagged');
      }
      if(barEl) barEl.innerHTML = '<div class="zone-bar-empty">Could not load session insights</div>';
    });
  }

  function applyRosterInsights(sessions, roster){
    var zoneCounts = emptyZoneCounts();
    var sent = 0;
    var fell = 0;
    var sinceMs = Date.now() - (7 * 24 * 60 * 60 * 1000);
    var byAthlete = {};

    (roster || []).forEach(function(r){
      if(r.athlete_id){
        byAthlete[r.athlete_id] = {
          zones: emptyZoneCounts(),
          panicWeek: 0
        };
      }
    });

    sessions.forEach(function(s){
      var aid = s.user_id;
      if(!aid) return;
      if(!byAthlete[aid]){
        byAthlete[aid] = { zones: emptyZoneCounts(), panicWeek: 0 };
      }
      var z = normalizeZone(s.zone);
      if(z){
        zoneCounts[z]++;
        byAthlete[aid].zones[z]++;
      }
      var bz = String(s.baseline_zone || '').toLowerCase();
      if(bz === 'sent') sent++;
      else if(bz === 'fell') fell++;
      // dna excluded from send-rate denominator
      if(z === 'panic' && s.created_at){
        var t = new Date(s.created_at).getTime();
        if(!isNaN(t) && t >= sinceMs) byAthlete[aid].panicWeek++;
      }
    });

    var zoneTotal = zoneCounts.comfort + zoneCounts.learning + zoneCounts.panic;
    var learningPct = zoneTotal ? Math.round((zoneCounts.learning / zoneTotal) * 100) : null;
    var attemptTotal = sent + fell;
    var sendPct = attemptTotal ? Math.round((sent / attemptTotal) * 100) : null;

    var flaggedIds = [];
    Object.keys(byAthlete).forEach(function(aid){
      if(byAthlete[aid].panicWeek >= PANIC_WEEK_THRESHOLD) flaggedIds.push(aid);
    });

    _rosterInsightsByAthlete = byAthlete;

    var learningEl = document.getElementById('stat-learning');
    var sendEl = document.getElementById('stat-send');
    var flaggedEl = document.getElementById('stat-flagged');
    var barEl = document.getElementById('team-zone-bar');
    if(learningEl) learningEl.textContent = learningPct === null ? '—' : (learningPct + '%');
    if(sendEl) sendEl.textContent = sendPct === null ? '—' : (sendPct + '%');
    if(flaggedEl){
      flaggedEl.textContent = String(flaggedIds.length);
      if(flaggedIds.length) flaggedEl.classList.add('flagged');
      else flaggedEl.classList.remove('flagged');
    }
    if(barEl){
      barEl.innerHTML = zoneBarSegsHtml(zoneCounts) + zoneBarLegendHtml(zoneCounts);
    }

    // Refresh roster rows so panic flags / mini bars appear once data is in.
    var listEl = document.getElementById('roster-list');
    if(listEl && roster && roster.length && !listEl.querySelector('.roster-empty')){
      Array.prototype.forEach.call(listEl.querySelectorAll('.roster-row'), function(row){
        var aid = row.getAttribute('data-athlete-id');
        var insight = byAthlete[aid];
        var side = row.querySelector('.roster-row-side');
        if(!side || !insight) return;
        var panicWeek = insight.panicWeek || 0;
        var crosses = panicWeek >= PANIC_WEEK_THRESHOLD;
        row.classList.toggle('flagged', crosses);
        var flagHtml = crosses
          ? '<div class="athlete-panic-flag">' + panicWeek + ' panic sessions this week</div>'
          : '';
        var miniHtml = '<div class="athlete-zone-mini">' + zoneBarSegsHtml(insight.zones, { compact: true }) + '</div>';
        side.innerHTML = rosterRowSideHtml(miniHtml, flagHtml);
      });
      wireRosterAssignButtons(listEl);
    }
    paintAthleteLandingStats();
  }

  function rosterRowSideHtml(miniHtml, flagHtml, unreadOn){
    return (miniHtml || '') +
      (flagHtml || '') +
      '<button type="button" class="roster-assign-btn">Assign</button>';
  }

  var _rosterAuthCtx = null;

  function wireRosterAssignButtons(listEl, token, user){
    if(token && user) _rosterAuthCtx = { token: token, user: user };
    var ctx = _rosterAuthCtx;
    if(!listEl || !ctx) return;
    Array.prototype.forEach.call(listEl.querySelectorAll('.roster-assign-btn'), function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        var rowEl = btn.closest('.roster-row');
        if(!rowEl) return;
        var athleteId = rowEl.getAttribute('data-athlete-id');
        var src = null;
        var idx = parseInt(rowEl.getAttribute('data-idx'), 10);
        if(!isNaN(idx) && _coachRoster[idx] && _coachRoster[idx].athlete_id === athleteId){
          src = _coachRoster[idx];
        } else {
          for(var i=0;i<_coachRoster.length;i++){
            if(_coachRoster[i].athlete_id === athleteId){ src = _coachRoster[i]; break; }
          }
        }
        _assignWizardCtx = {
          token: ctx.token,
          coachUser: ctx.user,
          athleteId: athleteId,
          athleteLabel: src ? athleteDisplayLabel(src) : (rowEl.getAttribute('data-athlete-label') || '')
        };
        startAssignWizard();
      });
    });
  }

  function renderRoster(token, user, roster){
    var listEl = document.getElementById('roster-list');
    if(!roster.length){
      listEl.innerHTML = '<div class="roster-empty">No athletes linked yet.</div>';
      return;
    }
    listEl.innerHTML = roster.map(function(row, i){
      var email = String(row.athlete_email || '').trim();
      var label = athleteDisplayLabel(row);
      var unread = !!(_rosterUnreadAthletes && _rosterUnreadAthletes[row.athlete_id]);
      var insight = _rosterInsightsByAthlete[row.athlete_id];
      var panicWeek = insight ? (insight.panicWeek || 0) : 0;
      var crosses = panicWeek >= PANIC_WEEK_THRESHOLD;
      var zones = insight ? insight.zones : emptyZoneCounts();
      var flagHtml = crosses
        ? '<div class="athlete-panic-flag">' + panicWeek + ' panic sessions this week</div>'
        : '';
      var miniHtml = '<div class="athlete-zone-mini">' + zoneBarSegsHtml(zones, { compact: true }) + '</div>';
      return '<div class="roster-row' + (crosses ? ' flagged' : '') + '" data-idx="' + i +
        '" data-athlete-id="' + escapeHtml(row.athlete_id) +
        '" data-athlete-email="' + escapeHtml(email) +
        '" data-athlete-label="' + escapeHtml(label) + '"' +
        (unread ? ' aria-label="' + escapeHtml(label) + ', unread message"' : '') + '>' +
        '<div class="roster-row-main">' +
          '<div class="roster-label">Athlete' +
            (unread ? '<span class="roster-unread-dot" aria-hidden="true"></span>' : '<span class="roster-unread-dot" hidden aria-hidden="true"></span>') +
          '</div>' +
          '<div class="roster-name">' + escapeHtml(label) + '</div>' +
          '<div class="roster-meta">Linked ' + fmtDate(row.linked_at) + '</div>' +
        '</div>' +
        '<div class="roster-row-side">' +
          rosterRowSideHtml(miniHtml, flagHtml) +
        '</div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.roster-row'), function(row){
      row.addEventListener('click', function(){
        Array.prototype.forEach.call(listEl.querySelectorAll('.roster-row'), function(r){ r.classList.remove('active'); });
        row.classList.add('active');
        renderAthleteDetail(
          token,
          user,
          row.dataset.athleteId,
          row.dataset.athleteLabel || '',
          row.dataset.athleteEmail || ''
        );
      });
    });
    wireRosterAssignButtons(listEl, token, user);
  }

  function paintAthleteLandingStats(){
    if(!_detailCtx) return;
    var insight = _rosterInsightsByAthlete[_detailCtx.athleteId] || { zones: emptyZoneCounts(), panicWeek: 0 };
    var zones = insight.zones || emptyZoneCounts();
    var total = (zones.comfort || 0) + (zones.learning || 0) + (zones.panic || 0);
    var learningPct = total ? Math.round((zones.learning / total) * 100) : null;
    var learnEl = document.getElementById('athlete-stat-learning');
    var panicEl = document.getElementById('athlete-stat-panic');
    var sessEl = document.getElementById('athlete-stat-sessions');
    var barEl = document.getElementById('athlete-zone-bar');

  var _coachGoalsCache = [];
  var _coachGoalAddPriority = 'primary';
  var _coachGoalEditingId = null;
  var _coachGoalsCtx = null;

  function goalPriorityKey(p){
    var s = String(p == null ? '' : p).toLowerCase();
    if(s === '1' || s === 'primary') return 'primary';
    return 'secondary';
  }

  function coachGoalPriToggleHtml(selected, kind){
    var pri = goalPriorityKey(selected);
    return '<div class="goal-pri-toggle" data-goal-pri-kind="' + kind + '">' +
      '<button type="button" class="goal-pri-btn' + (pri === 'primary' ? ' selected' : '') + '" data-priority="primary">Primary</button>' +
      '<button type="button" class="goal-pri-btn' + (pri === 'secondary' ? ' selected' : '') + '" data-priority="secondary">Secondary</button>' +
    '</div>';
  }

  function coachGoalRowHtml(g, coachUserId, editingId){
    var id = String(g.id || '');
    var mine = !!(coachUserId && g.author_id === coachUserId);
    var caption = mine ? 'Set by you' : 'Set by athlete';
    if(editingId && id === String(editingId)){
      return '<div class="goal-row" data-goal-id="' + escapeHtml(id) + '">' +
        '<input id="goal-edit-text" type="text" value="' + escapeHtml(g.text || '') + '">' +
        coachGoalPriToggleHtml(g.priority, 'edit') +
        '<div class="goal-actions">' +
          '<button type="button" class="assign-edit-btn" data-goal-save="' + escapeHtml(id) + '">Save</button>' +
          '<button type="button" class="assign-delete-btn" data-goal-cancel="1">Cancel</button>' +
        '</div>' +
      '</div>';
    }
    return '<div class="goal-row" data-goal-id="' + escapeHtml(id) + '">' +
      '<div class="goal-row-main">' +
        '<div>' +
          '<div class="goal-text">' + escapeHtml(g.text || '') + '</div>' +
          '<div class="goal-caption">' + caption + '</div>' +
        '</div>' +
        '<div class="goal-actions">' +
          '<button type="button" class="assign-edit-btn" data-goal-edit="' + escapeHtml(id) + '">Edit</button>' +
          '<button type="button" class="assign-delete-btn" data-goal-delete="' + escapeHtml(id) + '">Delete</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function coachGoalBlockHtml(label, list, coachUserId, editingId){
    if(!list.length) return '';
    return '<div class="goal-block-label">' + label + '</div>' +
      list.map(function(g){ return coachGoalRowHtml(g, coachUserId, editingId); }).join('');
  }

  function coachGoalAddFormHtml(){
    return '<div class="goal-add">' +
      '<div class="goal-add-label">+ Add a goal</div>' +
      '<div class="form-row"><label for="goal-add-text">Goal</label>' +
        '<input id="goal-add-text" type="text" placeholder="e.g. Send 5.12 this season"></div>' +
      coachGoalPriToggleHtml(_coachGoalAddPriority, 'add') +
      '<div class="form-actions"><button type="button" class="btn-primary" id="goal-add-save">Save</button></div>' +
    '</div>';
  }

  function paintCoachGoals(){
    var el = document.getElementById('detail-goals');
    if(!el || !_coachGoalsCtx) return;
    var addText = '';
    var addInput = document.getElementById('goal-add-text');
    if(addInput) addText = addInput.value;
    var coachUserId = _coachGoalsCtx.coachUser && _coachGoalsCtx.coachUser.id;
    var rows = _coachGoalsCache;
    var listHtml;
    if(!rows.length){
      listHtml = '<div class="form-note">No goals set for this athlete yet.</div>';
    } else {
      var primary = rows.filter(function(g){ return goalPriorityKey(g.priority) === 'primary'; });
      var secondary = rows.filter(function(g){ return goalPriorityKey(g.priority) !== 'primary'; });
      listHtml = coachGoalBlockHtml('Primary', primary, coachUserId, _coachGoalEditingId) +
        coachGoalBlockHtml('Secondary', secondary, coachUserId, _coachGoalEditingId);
    }
    el.innerHTML =
      '<div class="panel-title">Training Goals</div>' +
      '<div class="goal-list">' + listHtml + '</div>' +
      coachGoalAddFormHtml() +
      '<div id="goal-msg"></div>';
    if(addText){
      var restored = document.getElementById('goal-add-text');
      if(restored) restored.value = addText;
    }
    wireCoachGoals(el);
  }

  function setCoachGoalMsg(html){
    var msgEl = document.getElementById('goal-msg');
    if(msgEl) msgEl.innerHTML = html || '';
  }

  function wireCoachGoals(rootEl){
    if(!rootEl || !_coachGoalsCtx) return;
    Array.prototype.forEach.call(rootEl.querySelectorAll('.goal-pri-btn'), function(btn){
      btn.addEventListener('click', function(){
        var wrap = btn.parentNode;
        var kind = wrap && wrap.getAttribute('data-goal-pri-kind');
        var pri = goalPriorityKey(btn.getAttribute('data-priority'));
        if(kind === 'add'){
          _coachGoalAddPriority = pri;
          Array.prototype.forEach.call(wrap.querySelectorAll('.goal-pri-btn'), function(b){
            b.classList.toggle('selected', goalPriorityKey(b.getAttribute('data-priority')) === pri);
          });
          return;
        }
        var g = _coachGoalsCache.find(function(x){ return String(x.id) === String(_coachGoalEditingId); });
        if(g) g.priority = pri;
        paintCoachGoals();
      });
    });
    Array.prototype.forEach.call(rootEl.querySelectorAll('[data-goal-edit]'), function(btn){
      btn.addEventListener('click', function(){
        _coachGoalEditingId = btn.getAttribute('data-goal-edit');
        paintCoachGoals();
      });
    });
    Array.prototype.forEach.call(rootEl.querySelectorAll('[data-goal-cancel]'), function(btn){
      btn.addEventListener('click', function(){
        _coachGoalEditingId = null;
        paintCoachGoals();
      });
    });
    Array.prototype.forEach.call(rootEl.querySelectorAll('[data-goal-save]'), function(btn){
      btn.addEventListener('click', function(){
        saveEditCoachGoal(btn.getAttribute('data-goal-save'));
      });
    });
    Array.prototype.forEach.call(rootEl.querySelectorAll('[data-goal-delete]'), function(btn){
      btn.addEventListener('click', function(){
        deleteCoachGoal(btn.getAttribute('data-goal-delete'));
      });
    });
    var addBtn = document.getElementById('goal-add-save');
    if(addBtn) addBtn.addEventListener('click', saveNewCoachGoal);
  }

  function loadAthleteGoals(token, coachUser, athleteId, athleteLabel){
    _coachGoalsCtx = {
      token: token,
      coachUser: coachUser,
      athleteId: athleteId,
      athleteLabel: athleteLabel || ''
    };
    var el = document.getElementById('detail-goals');
    if(!el) return;
    return sbSelect(
      token,
      'athlete_goals',
      'select=id,text,priority,author_id,created_at&athlete_id=eq.' + athleteId +
        '&order=priority.asc,created_at.asc'
    ).then(function(rows){
      _coachGoalsCache = Array.isArray(rows) ? rows : [];
      _coachGoalEditingId = null;
      paintCoachGoals();
      paintAthleteHubBadges();
    }).catch(function(err){
      _coachGoalsCache = [];
      paintAthleteHubBadges();
      el.innerHTML = '<div class="panel-title">Training Goals</div><div class="form-error">Failed to load — ' +
        escapeHtml(err.message || 'unknown error') + '</div>';
    });
  }

  var COACH_BASELINE_TERRAINS = ['Slab', 'Vertical', 'Overhang', 'Roof', 'Crack'];

  function parseBaselineTerrainState(raw){
    if(!raw) return null;
    if(typeof raw === 'object' && !Array.isArray(raw)) return raw;
    if(typeof raw === 'string'){
      try{
        var parsed = JSON.parse(raw);
        if(parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
      }catch(e){}
    }
    return null;
  }

  function loadAthleteBaseline(token, coachUser, athleteId){
    var el = document.getElementById('detail-baseline');
    if(!el) return;
    return sbSelect(
      token,
      'sessions',
      'select=id,baseline_terrain_state,baseline_terrain_calibrated,created_at' +
        '&is_baseline=eq.true&user_id=eq.' + athleteId +
        '&order=created_at.desc&limit=1'
    ).then(function(rows){
      var row = Array.isArray(rows) && rows[0] ? rows[0] : null;
      _coachBaselineSet = !!row;
      paintAthleteHubBadges();
      if(!row){
        el.innerHTML = '<div class="panel-title">Baseline</div>' +
          '<div class="form-note">No baseline set yet.</div>';
        return;
      }
      var state = parseBaselineTerrainState(row.baseline_terrain_state) || {};
      var cal = parseBaselineTerrainState(row.baseline_terrain_calibrated) || {};
      var when = row.created_at
        ? '<div class="form-note" style="margin-top:0;margin-bottom:10px;">Recorded ' + fmtDate(row.created_at) + '</div>'
        : '';
      var list = COACH_BASELINE_TERRAINS.map(function(t){
        var expect = state[t] ? String(state[t]) : 'Not set';
        var badge = cal[t]
          ? '<span class="baseline-calibrated">Calibrated</span>'
          : '';
        return '<div class="baseline-row">' +
          '<div>' +
            '<div class="baseline-terrain">' + escapeHtml(t) + '</div>' +
            '<div class="baseline-expect">' + escapeHtml(expect) + '</div>' +
          '</div>' +
          badge +
        '</div>';
      }).join('');
      el.innerHTML = '<div class="panel-title">Baseline</div>' + when + list;
    }).catch(function(err){
      _coachBaselineSet = false;
      paintAthleteHubBadges();
      el.innerHTML = '<div class="panel-title">Baseline</div><div class="form-error">Failed to load — ' +
        escapeHtml(err.message || 'unknown error') + '</div>';
    });
  }

  function saveNewCoachGoal(){
    if(!_coachGoalsCtx) return;
    var token = _coachGoalsCtx.token;
    var coachUser = _coachGoalsCtx.coachUser;
    var athleteId = _coachGoalsCtx.athleteId;
    var input = document.getElementById('goal-add-text');
    var text = input ? input.value.trim() : '';
    if(!text){
      setCoachGoalMsg('<div class="form-error">Goal text is required.</div>');
      return;
    }
    var btn = document.getElementById('goal-add-save');
    if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
    fetch(SB_URL + '/rest/v1/athlete_goals', {
      method: 'POST',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({
        author_id: coachUser.id,
        athlete_id: athleteId,
        coach_id: coachUser.id,
        priority: _coachGoalAddPriority === 'primary' ? 'primary' : 'secondary',
        text: text
      })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      if(input) input.value = '';
      _coachGoalAddPriority = 'primary';
      setCoachGoalMsg('');
      return loadAthleteGoals(token, coachUser, athleteId, _coachGoalsCtx.athleteLabel);
    }).catch(function(err){
      setCoachGoalMsg('<div class="form-error">Failed to save. ' +
        escapeHtml(err.message || 'Unknown error') + '</div>');
    }).then(function(){
      if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
    });
  }

  function saveEditCoachGoal(id){
    if(!_coachGoalsCtx || !id) return;
    var token = _coachGoalsCtx.token;
    var input = document.getElementById('goal-edit-text');
    var text = input ? input.value.trim() : '';
    if(!text){
      setCoachGoalMsg('<div class="form-error">Goal text is required.</div>');
      return;
    }
    var g = _coachGoalsCache.find(function(x){ return String(x.id) === String(id); });
    var priority = goalPriorityKey(g && g.priority);
    var btn = document.querySelector('[data-goal-save="' + id + '"]');
    if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
    fetch(SB_URL + '/rest/v1/athlete_goals?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ text: text, priority: priority })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      _coachGoalEditingId = null;
      return loadAthleteGoals(token, _coachGoalsCtx.coachUser, _coachGoalsCtx.athleteId, _coachGoalsCtx.athleteLabel);
    }).catch(function(err){
      if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
      setCoachGoalMsg('<div class="form-error">Failed to save. ' +
        escapeHtml(err.message || 'Unknown error') + '</div>');
    });
  }

  function deleteCoachGoal(id){
    if(!_coachGoalsCtx || !id) return;
    if(!window.confirm('Delete this goal?')) return;
    var token = _coachGoalsCtx.token;
    fetch(SB_URL + '/rest/v1/athlete_goals?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: sbHeaders(token)
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      if(String(_coachGoalEditingId) === String(id)) _coachGoalEditingId = null;
      return loadAthleteGoals(token, _coachGoalsCtx.coachUser, _coachGoalsCtx.athleteId, _coachGoalsCtx.athleteLabel);
    }).catch(function(err){
      setCoachGoalMsg('<div class="form-error">Failed to delete. ' +
        escapeHtml(err.message || 'Unknown error') + '</div>');
    });
  }

  function wireCoachAssignmentActions(token, coachUser, athleteId, rootEl){
    Array.prototype.forEach.call(rootEl.querySelectorAll('.assign-edit-btn'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var src = _lastCoachAssignments.find(function(a){ return a.id === id; });
        if(!src) return;
        startAssignWizardFromAssignment(src, 'edit');
      });
    });
    Array.prototype.forEach.call(rootEl.querySelectorAll('.assign-repeat-btn'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var src = _lastCoachAssignments.find(function(a){ return a.id === id; });
        if(!src) return;
        // Prefill wizard (due blank) — POST only after coach confirms at step 5.
        startAssignWizardFromAssignment(src, 'repeat');
      });
    });
    Array.prototype.forEach.call(rootEl.querySelectorAll('.assign-delete-btn'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var src = _lastCoachAssignments.find(function(a){ return a.id === id; });
        if(!src) return;
        var label = src.title ? '"' + src.title + '"' : 'this assignment';
        if(!window.confirm('Delete ' + label + '? It will be removed from the list.')) return;
        btn.disabled = true;
        var prev = btn.textContent;
        btn.textContent = 'Deleting...';
        softDeleteCoachAssignment(token, id)
          .then(function(){
            return loadAssignments(token, coachUser, athleteId);
          })
          .catch(function(err){
            btn.disabled = false;
            btn.textContent = prev;
            alert('Failed to delete — ' + ((err && err.message) || 'unknown error'));
          });
      });
    });
  }

  // Soft-delete: set deleted_at (reads already filter deleted_at=is.null).
  function softDeleteCoachAssignment(token, assignmentId){
    return fetch(SB_URL + '/rest/v1/assignments?id=eq.' + encodeURIComponent(assignmentId), {
      method: 'PATCH',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ deleted_at: new Date().toISOString() })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      return res.json();
    });
  }

  function patchCoachAssignment(token, assignmentId, fields){
    return fetch(SB_URL + '/rest/v1/assignments?id=eq.' + encodeURIComponent(assignmentId), {

  // ── Workout catalogs (coach-side) ────────────────────────
  // Foundational rows live in workout_library (read-only for coaches).
  // Coach/athlete customs live in custom_workouts. Assignments reference
  // one or the other via library_item_id XOR custom_workout_item_id.

  // Locked training_focus taxonomy (single field). Replaces the old
  // type + category two-step. Exact strings — John enforces via CHECK.
  var LOCKED_WORKOUT_CATEGORIES = [
    'Boulders',
    'Routes',
    'Boards',
    'Hangboard',
    'Strength & Weights',
    'Mobility & Flexibility',
    'Technique & Footwork',
    'Cardio & Capacity',
    'Mental/Other'
  ];

  // Legacy category / dirty strings / old energy-system types → canonical focus.
  var TRAINING_FOCUS_ALIASES = {
    'boulders': 'Boulders',
    'boulder circuits': 'Boulders',
    'limit bouldering': 'Boulders',
    'routes': 'Routes',
    'route climbing': 'Routes',
    'boards': 'Boards',
    'campus board': 'Boards',
    'hangboard': 'Hangboard',
    'strength & weights': 'Strength & Weights',
    'core & antagonist strength': 'Strength & Weights',
    'strength': 'Strength & Weights',
    'mobility & flexibility': 'Mobility & Flexibility',
    'flexibility & mobility': 'Mobility & Flexibility',
    'mobility': 'Mobility & Flexibility',
    'technique & footwork': 'Technique & Footwork',
    'footwork & technique': 'Technique & Footwork',
    'cardio & capacity': 'Cardio & Capacity',
    'aerobic base/capacity': 'Cardio & Capacity',
    'mental/other': 'Mental/Other',
    'mental': 'Mental/Other',
    'mental training': 'Mental/Other'
  };

  function normalizeTrainingFocus(value){
    var raw = String(value || '').trim().replace(/\s+/g, ' ');
    if(!raw) return '';
    var lower = raw.toLowerCase();
    var i;
    for(i = 0; i < LOCKED_WORKOUT_CATEGORIES.length; i++){
      if(LOCKED_WORKOUT_CATEGORIES[i].toLowerCase() === lower) return LOCKED_WORKOUT_CATEGORIES[i];
    }
    if(TRAINING_FOCUS_ALIASES[lower]) return TRAINING_FOCUS_ALIASES[lower];
    return '';
  }

  function isLockedWorkoutCategory(category){
    return normalizeTrainingFocus(category) !== '';
  }

  function mapLegacyTypeToFocus(type){
    if(type === 'strength') return 'Strength & Weights';
    if(type === 'power') return 'Boulders';
    if(type === 'endurance' || type === 'capacity') return 'Cardio & Capacity';
    if(type === 'skill_development') return 'Technique & Footwork';
    if(type === 'mobility') return 'Mobility & Flexibility';
    if(type === 'mental') return 'Mental/Other';
    return '';
  }

  function itemTrainingFocus(item){
    if(!item) return '';
    return normalizeTrainingFocus(item.training_focus)
      || normalizeTrainingFocus(item.category)
      || mapLegacyTypeToFocus(item.type)
      || '';
  }

  function coachLibFocusLabel(focus){
    return normalizeTrainingFocus(focus) || (focus || '');
  }

  function selectCoachLibRows(token, table, extraCols){
    var base = table === 'custom_workouts'
      ? 'id,category,name,description,type,visibility,created_by,created_at'
      : 'id,category,name,description,type,created_at';
    return sbSelect(token, table, 'select=' + base + extraCols + '&order=name.asc');
  }

  function loadCoachWorkoutLibrary(token){
    function loadFoundational(){
      return selectCoachLibRows(token, 'workout_library', ',training_focus')
        .catch(function(){ return selectCoachLibRows(token, 'workout_library', ''); })
        .catch(function(){ return []; });
    }
    function loadCustoms(){
      return selectCoachLibRows(token, 'custom_workouts', ',training_focus,sections')
        .catch(function(){ return selectCoachLibRows(token, 'custom_workouts', ',training_focus'); })
        .catch(function(){ return selectCoachLibRows(token, 'custom_workouts', ',sections'); })
        .catch(function(){ return selectCoachLibRows(token, 'custom_workouts', ''); })
        .catch(function(){ return []; });
    }
    return Promise.all([loadFoundational(), loadCustoms()]).then(function(parts){
      var foundational = Array.isArray(parts[0]) ? parts[0] : [];
      var customs = Array.isArray(parts[1]) ? parts[1] : [];
      return foundational.map(function(r){
        return Object.assign({}, r, { _source: 'foundational', _focus: itemTrainingFocus(r) });
      }).concat(customs.map(function(r){
        return Object.assign({}, r, { _source: 'custom', _focus: itemTrainingFocus(r) });
      }));
    });
  }

  // Coach-created drills go into custom_workouts (foundational catalog is
  // not coach-editable). Do NOT set visibility — DB default + coach_flags
  // trigger decide shared vs private.
  function createCoachCustomWorkout(token, coachUser, fields){
    var focus = normalizeTrainingFocus(fields.trainingFocus || fields.category);
    var payload = {
      training_focus: focus || null,
      category: focus || fields.category,
      name: fields.name,
      description: fields.description || null,
      created_by: coachUser.id,
      sections: fields.sections || null
    };
    function post(body){
      return fetch(SB_URL + '/rest/v1/custom_workouts', {
        method: 'POST',
        headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
        body: JSON.stringify(body)
      }).then(function(res){
        if(!res.ok) return res.json().then(function(err){ throw err; });
        return res.json().then(function(rows){
          return Array.isArray(rows) ? rows[0] : rows;
        });
      });
    }
    return post(payload).catch(function(err){
      var missing = err && (err.code === 'PGRST204' || err.code === '42703');
      if(missing && Object.prototype.hasOwnProperty.call(payload, 'training_focus')){
        var retry = Object.assign({}, payload);
        delete retry.training_focus;
        return post(retry);
      }
      throw err;
    });
  }

      });
    });
  }

  function saveEditCustomWorkout(){
    var nameEl = document.getElementById('edit-cw-name');
    var descEl = document.getElementById('edit-cw-desc');
    var name = nameEl ? (nameEl.value || '').trim() : '';
    if(!name){
      document.getElementById('new-a-msg').innerHTML = '<div class="form-error">Name is required.</div>';
      return;
    }
    var sections = cleanedAssignWizardSections();
    var btn = document.getElementById('edit-cw-save');
    if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
    fetch(SB_URL + '/rest/v1/custom_workouts?id=eq.' + _assignWizard.editingCustomWorkoutId, {
      method: 'PATCH',
      headers: Object.assign(sbHeaders(_assignWizardCtx.token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ name: name, description: (descEl ? descEl.value : '').trim() || null, sections: sections })
    }).then(function(res){
      if(btn){ btn.disabled = false; btn.textContent = 'Save changes'; }
      if(!res.ok) return res.json().then(function(err){ throw err; });
      _assignWizard.editingCustomWorkoutId = null;
      loadCoachWorkoutLibrary(_assignWizardCtx.token).then(function(rows){ _coachLibCache = Array.isArray(rows) ? rows : []; });
      closeAssignWizardOverlay();
      resetAssignWizard();
      showAssignSavedBanner('Workout updated.');
    }).catch(function(err){
      if(btn){ btn.disabled = false; btn.textContent = 'Save changes'; }
      document.getElementById('new-a-msg').innerHTML = '<div class="form-error">Failed. ' + escapeHtml((err && err.message) || 'unknown error') + '</div>';
    });
  }

  function findLibItemForAssignment(assignment){
    if(!assignment) return null;
    if(assignment.custom_workout_item_id){
      return (_coachLibCache || []).find(function(r){
        return r.id === assignment.custom_workout_item_id && r._source === 'custom';
      }) || null;
    }
    if(assignment.library_item_id){
      return (_coachLibCache || []).find(function(r){
        return r.id === assignment.library_item_id && r._source !== 'custom';
      }) || null;
    }

  function drillsForTrainingFocus(focus){
    var want = normalizeTrainingFocus(focus);
    if(!want) return [];
    return _coachLibCache.filter(function(item){
      return item._focus === want;
    });
  }

  // scope: 'all' (full catalog — step 1 shows everything when the query is
  // empty) or 'focus' (chosen training_focus — step 2 browse).
  function filterWizardLibraryResults(query, scope){
    var q = (query || '').trim().toLowerCase();
    var rows = _coachLibCache || [];
    if(scope === 'focus'){
      rows = drillsForTrainingFocus(_assignWizard.trainingFocus);
    }
    if(!q) return rows;
    return rows.filter(function(item){
      var hay = ((item.name || '') + ' ' + (item.description || '') + ' ' + (item._focus || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function applyWizardLibraryPick(item){
    if(!item || !_assignWizard) return;
    var src = item._source === 'custom' ? 'custom' : 'foundational';
    _assignWizard.trainingFocus = item._focus || itemTrainingFocus(item) || _assignWizard.trainingFocus;
    if(src === 'custom'){
      _assignWizard.customWorkoutItemId = item.id;
      _assignWizard.libraryItemId = null;
      _assignWizard.itemSource = 'custom';
    } else {
      _assignWizard.libraryItemId = item.id;
      _assignWizard.customWorkoutItemId = null;
      _assignWizard.itemSource = 'foundational';
    }
    _coachLibSelectedId = item.id;
    _assignWizard.drillName = item.name || '';
    _assignWizard.libraryDescription = item.description || '';
    _assignWizard.assignDescription = item.description || '';
    _assignWizard.createMode = false;
    _assignWizard.createEntryStep = null;
    _assignWizard.editingCustomWorkoutId = null;
    goAssignWizardStep(3);
  }

    _assignWizard.createEntryStep = entryStep || 1;
    _assignWizard.editingCustomWorkoutId = null;
    _assignWizard.libraryItemId = null;
    _assignWizard.customWorkoutItemId = null;
    _assignWizard.itemSource = null;
    _coachLibSelectedId = null;

    _assignWizard.assignDescription = '';

  function enterEditCustomWorkout(item){
    _assignWizard.editingCustomWorkoutId = item.id;
    _assignWizard.createMode = false;
    _assignWizard.trainingFocus = item._focus || itemTrainingFocus(item);
    _assignWizard.drillName = item.name || '';
    _assignWizard.libraryDescription = item.description || '';
    var raw = item.sections;
    if(typeof raw === 'string'){
      try{ raw = JSON.parse(raw); }catch(e){ raw = []; }
    }
    _assignWizard.sections = Array.isArray(raw)
      ? raw.map(function(s, i){ return { id: 'sec-' + i + '-' + Date.now(), label: (s && s.label) || '' }; })
      : [];
    goAssignWizardStep(2);
  }

  function renderWizardLibraryResults(opts){
    opts = opts || {};
    var scope = opts.scope || 'focus';
    var showPathMeta = !!opts.showPathMeta;
    var resultsEl = document.getElementById('new-a-lib-results');
    var searchEl = document.getElementById('new-a-lib-search');
    if(!resultsEl || !_assignWizard) return;
    var query = searchEl ? searchEl.value : '';
    var rows = filterWizardLibraryResults(query, scope);
    if(!rows.length){
      resultsEl.innerHTML = '<div class="aw-lib-empty">No workouts match this search.</div>';
      return;
    }
    resultsEl.innerHTML = rows.map(function(item){
      var src = item._source === 'custom' ? 'custom' : 'foundational';
      var selected = src === 'custom'
        ? (item.id === _assignWizard.customWorkoutItemId ? ' selected' : '')
        : (item.id === _assignWizard.libraryItemId ? ' selected' : '');
      var meta = '';
      if(showPathMeta){
        meta = escapeHtml(item._focus || coachLibFocusLabel(item.training_focus) || item.category || '');
      } else {
        var snippet = (item.description || '').replace(/\s+/g, ' ').trim();
        if(snippet.length > 100) snippet = snippet.slice(0, 100) + '…';
        meta = escapeHtml(snippet);
      }
      var canEdit = src === 'custom' && _assignWizardCtx && item.created_by === _assignWizardCtx.coachUser.id;
      return '<button type="button" class="aw-chip' + selected + '" data-id="' + escapeHtml(item.id) +
        '" data-source="' + src + '">' +
        escapeHtml(item.name) + sourceBadgeHtml(item) +
        (meta ? '<span class="aw-chip-meta">' + meta + '</span>' : '') +
      '</button>' +
      (canEdit ? '<button type="button" class="aw-edit-custom-link" data-edit-id="' + escapeHtml(item.id) + '" style="background:none;border:none;color:var(--text-secondary);font-size:11px;cursor:pointer;padding:2px 0 10px;display:block;">Edit this workout</button>' : '');
    }).join('');
  }

  function wireWizardSearchResults(scope){
    var resultsEl = document.getElementById('new-a-lib-results');
    var searchEl = document.getElementById('new-a-lib-search');
    if(!resultsEl || !searchEl) return;
    var opts = {
      scope: scope,
      showPathMeta: scope === 'all'
    };
    renderWizardLibraryResults(opts);
    searchEl.addEventListener('input', function(){
      renderWizardLibraryResults(opts);
    });
    resultsEl.addEventListener('click', function(e){
      var editBtn = e.target.closest('.aw-edit-custom-link');
      if(editBtn){
        var editId = editBtn.getAttribute('data-edit-id');
        var item = _coachLibCache.find(function(r){ return r.id === editId && r._source === 'custom'; });
        if(item) enterEditCustomWorkout(item);
        return;
      }
      var btn = e.target.closest('.aw-chip');
      if(!btn) return;
      var id = btn.getAttribute('data-id');
      var src = btn.getAttribute('data-source') || 'foundational';
      var item = _coachLibCache.find(function(r){
        return r.id === id && (r._source === 'custom' ? 'custom' : 'foundational') === src;
      });
      if(!item) return;
      if(scope === 'focus' && item._focus !== normalizeTrainingFocus(_assignWizard.trainingFocus)) return;
      applyWizardLibraryPick(item);
    });
  }

  function wizardStepLabel(step){
    if(step === 1) return 'Find workout';
    if(step === 2) return _assignWizard && (_assignWizard.createMode || _assignWizard.editingCustomWorkoutId) ? 'Create' : 'Workout';
    if(step === 3) return 'Customize';
    if(step === 4) return 'Schedule';
    return '';
  }

  function wizardPathSummaryHtml(){
    var parts = [];
    if(_assignWizard.trainingFocus) parts.push('<b>' + escapeHtml(coachLibFocusLabel(_assignWizard.trainingFocus)) + '</b>');
    if(_assignWizard.drillName) parts.push('<b>' + escapeHtml(_assignWizard.drillName) + '</b>');

  function setAssignWizardChrome(q, hint){
    var step = _assignWizard.step;
    var numEl = document.getElementById('aw-step-num');
    var qEl = document.getElementById('aw-q');
    var hintEl = document.getElementById('aw-hint');
    var fill = document.getElementById('aw-prog-fill');
    var heroSub = document.getElementById('aw-hero-sub');
    // Keep "Step N of 4" even when search shortcuts jump ahead — path summary
    // under the title shows what was already chosen (focus · name).
    if(numEl) numEl.textContent = 'Step ' + step + ' of 4 · ' + wizardStepLabel(step);
    if(qEl) qEl.textContent = q || '';
    if(hintEl) hintEl.textContent = hint || '';
    if(fill) fill.style.width = Math.round((step / 4) * 100) + '%';
    if(heroSub && _assignWizardCtx){
      var forWhom = _assignWizardCtx.athleteLabel || 'this athlete';
      heroSub.textContent = 'For ' + forWhom + '.';
    }

  function setAssignWizardFooter(html){

  }

  function goAssignWizardStep(step){

  function openAssignWizardOverlay(){
    var overlay = document.getElementById('assign-wizard-overlay');

    overlay.classList.add('open');

  function closeAssignWizardOverlay(){
    var overlay = document.getElementById('assign-wizard-overlay');
    if(!overlay) return;
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    setAssignWizardFooter('');
