  function submitAssignWizard(){
    var ctx = _assignWizardCtx;
    if(!ctx || !_assignWizard) return;
    var token = ctx.token;
    var coachUser = ctx.coachUser;
    var athleteId = ctx.athleteId;
    var msgEl = document.getElementById('new-a-msg');
    var btn = document.getElementById('new-a-submit');
    var dueInput = document.getElementById('new-a-due');
    var linkInput = document.getElementById('new-a-link');
    var due = dueInput ? dueInput.value : '';
    var link = linkInput ? linkInput.value.trim() : '';
    _assignWizard.dueDate = due;
    _assignWizard.resourceLink = link;

    var isEdit = _assignWizard.mode === 'edit' && _assignWizard.editAssignmentId;

    if(!_assignWizard.drillName){
      msgEl.innerHTML = '<div class="form-error">Wizard is incomplete — go back and finish each step.</div>';
      return;
    }
    // Library/custom picks do not write taxonomy on the assignment row.
    // Only validate training_focus when creating a custom workout.
    if(_assignWizard.createMode){
      var createFocus = normalizeTrainingFocus(_assignWizard.trainingFocus);
      if(!createFocus){
        msgEl.innerHTML = '<div class="form-error">Training focus must be one of the locked taxonomy values.</div>';
        return;
      }
      _assignWizard.trainingFocus = createFocus;
    }
    if(link && !/^https?:\/\//i.test(link)){
      msgEl.innerHTML = '<div class="form-error">Resource link must start with http:// or https://</div>';
      return;
    }

    var assignDescription = (_assignWizard.assignDescription || '').trim() || null;
    var doneMsg = isEdit ? 'Assignment updated.' : 'Assignment saved.';

    function finishSuccess(){
      if(btn){
        btn.disabled = false;
        btn.textContent = wizardSubmitLabel();
      }
      loadAssignments(token, coachUser, athleteId);
      loadCoachWorkoutLibrary(token).then(function(rows){
        _coachLibCache = Array.isArray(rows) ? rows : [];
      }).catch(function(){ /* non-blocking */ });
      closeAssignWizardOverlay();
      resetAssignWizard();
      syncWizardShellMode();
      showAssignSavedBanner(doneMsg);
    }

    function failCreate(err){
      if(btn){
        btn.disabled = false;
        btn.textContent = wizardSubmitLabel();
      }
      var isMissingColumn = err && (err.code === 'PGRST204' || err.code === '42703');
      var msg = (err && err.message) || 'unknown error';
      msgEl.innerHTML = '<div class="form-error">' +
        (isMissingColumn
          ? 'A required column is missing in Supabase (resource_link, library_item_id, or custom_workout_item_id). Check recent migrations.'
          : 'Failed. ' + escapeHtml(msg)) +
        '</div>';
    }

    if(btn){
      btn.disabled = true;
      btn.textContent = wizardBusyLabel();
    }

    // Edit existing row — PATCH title/description/due/link (+ workout FKs).
    if(isEdit){
      function applyEditPatch(extra){
        var patch = {
          title: _assignWizard.drillName,
          description: assignDescription,
          due_date: due || null,
          resource_link: link || null
        };
        if(extra){
          if(extra.custom_workout_item_id){
            patch.custom_workout_item_id = extra.custom_workout_item_id;
            patch.library_item_id = null;
          } else if(extra.library_item_id){
            patch.library_item_id = extra.library_item_id;
            patch.custom_workout_item_id = null;
          }
        } else if(!_assignWizard.createMode){
          if(_assignWizard.customWorkoutItemId){
            patch.custom_workout_item_id = _assignWizard.customWorkoutItemId;
            patch.library_item_id = null;
          } else if(_assignWizard.libraryItemId){
            patch.library_item_id = _assignWizard.libraryItemId;
            patch.custom_workout_item_id = null;
          }
        }
        return patchCoachAssignment(token, _assignWizard.editAssignmentId, patch);
      }

      if(_assignWizard.createMode){
        if(!normalizeTrainingFocus(_assignWizard.trainingFocus)){
          failCreate({ message: 'Pick a training focus for the custom workout.' });
          return;
        }
        createCoachCustomWorkout(token, coachUser, {
          trainingFocus: _assignWizard.trainingFocus,
          name: _assignWizard.drillName,
          description: (_assignWizard.libraryDescription || '').trim() || null,
          sections: cleanedAssignWizardSections()
        }).then(function(customRow){
          if(!customRow || !customRow.id) throw { message: 'Custom workout insert returned no id' };
          return applyEditPatch({ custom_workout_item_id: customRow.id });
        }).then(finishSuccess).catch(failCreate);
        return;
      }

      applyEditPatch(null).then(finishSuccess).catch(failCreate);
      return;
    }

    // Existing foundational or custom workout — link only, no re-insert.
    // Assignments take library_item_id XOR custom_workout_item_id (never both).
    // Also covers Repeat (mode=repeat): POST a new row after coach reviews.
    if(!_assignWizard.createMode && (_assignWizard.libraryItemId || _assignWizard.customWorkoutItemId)){
      var assignPayload = {
        coach_id: coachUser.id,
        athlete_id: athleteId,
        title: _assignWizard.drillName,
        description: assignDescription,
        due_date: due || null
      };
      if(_assignWizard.customWorkoutItemId){
        assignPayload.custom_workout_item_id = _assignWizard.customWorkoutItemId;
      } else {
        assignPayload.library_item_id = _assignWizard.libraryItemId;
      }
      if(link) assignPayload.resource_link = link;
      createCoachLibraryAssignment(token, assignPayload).then(finishSuccess).catch(failCreate);
      return;
    }

    // Brand-new custom workout: insert into custom_workouts (training_focus
    // locked from the wizard), then assign via custom_workout_item_id.
    // Do not write to workout_library (foundational catalog is read-only).
    createCoachCustomWorkout(token, coachUser, {
      trainingFocus: _assignWizard.trainingFocus,
      name: _assignWizard.drillName,
      description: (_assignWizard.libraryDescription || '').trim() || null,
      sections: cleanedAssignWizardSections()
    }).then(function(customRow){
      if(!customRow || !customRow.id) throw { message: 'Custom workout insert returned no id' };
      var payload = {
        coach_id: coachUser.id,
        athlete_id: athleteId,
        title: _assignWizard.drillName,
        description: assignDescription,
        due_date: due || null,
        custom_workout_item_id: customRow.id
      };
      if(link) payload.resource_link = link;
      return createCoachLibraryAssignment(token, payload);
    }).then(finishSuccess).catch(failCreate);
  }

  function startAssignWizard(){
    var ctx = _assignWizardCtx;
    if(!ctx) return;
    resetAssignWizard();
    syncWizardShellMode();
    openAssignWizardOverlay();
    var body = document.getElementById('wiz-body');
    if(body) body.innerHTML = '<div class="aw-lib-empty">Loading workouts…</div>';
    setAssignWizardChrome('Loading workouts…', 'Pulling foundational catalog and custom workouts.');
    setAssignWizardFooter('');
    loadCoachWorkoutLibrary(ctx.token).then(function(rows){
      _coachLibCache = Array.isArray(rows) ? rows : [];
      renderAssignWizardBody();
    }).catch(function(err){
      _assignWizard.libLoadError = (err && err.message) || 'unknown error';
      setAssignWizardChrome('Could not load workouts', 'Check your connection and try again.');
      if(body){
        body.innerHTML = '<div class="form-error">' + escapeHtml(_assignWizard.libLoadError) + '</div>';
      }
      setAssignWizardFooter('<button type="button" class="aw-secondary-btn" id="aw-close-err">← Close</button>');
      var closeBtn = document.getElementById('aw-close-err');
      if(closeBtn) closeBtn.addEventListener('click', closeAssignWizardOverlay);
    });
  }

  // Prefill wizard from an existing assignment and jump to customize (step 3).
  // mode 'edit' → PATCH on submit; mode 'repeat' → POST new row, due blank.
  function startAssignWizardFromAssignment(assignment, mode){
    var ctx = _assignWizardCtx;
    if(!ctx || !assignment) return;
    resetAssignWizard();
    _assignWizard.mode = mode === 'edit' ? 'edit' : 'repeat';
    _assignWizard.editAssignmentId = mode === 'edit' ? assignment.id : null;
    _assignWizard.createMode = false;
    _assignWizard.drillName = assignment.title || '';
    _assignWizard.assignDescription = assignment.description || '';
    _assignWizard.libraryDescription = assignment.description || '';
    _assignWizard.resourceLink = assignment.resource_link || '';
    // Edit keeps due date; Repeat starts fresh (blank due).
    _assignWizard.dueDate = mode === 'edit' ? dueDateInputValue(assignment.due_date) : '';
    if(assignment.custom_workout_item_id){
      _assignWizard.customWorkoutItemId = assignment.custom_workout_item_id;
      _assignWizard.libraryItemId = null;
      _assignWizard.itemSource = 'custom';
    } else if(assignment.library_item_id){
      _assignWizard.libraryItemId = assignment.library_item_id;
      _assignWizard.customWorkoutItemId = null;
      _assignWizard.itemSource = 'foundational';
    }
    syncWizardShellMode();
    openAssignWizardOverlay();
    var body = document.getElementById('wiz-body');
    if(body) body.innerHTML = '<div class="aw-lib-empty">Loading workouts…</div>';
    setAssignWizardChrome('Loading workouts…', 'Pulling foundational catalog and custom workouts.');
    setAssignWizardFooter('');
    loadCoachWorkoutLibrary(ctx.token).then(function(rows){
      _coachLibCache = Array.isArray(rows) ? rows : [];
      var item = findLibItemForAssignment(assignment);
      if(item){

  function journalFieldHtml(label, value){
    if(value == null || !String(value).trim()) return '';
    return '<div class="journal-field">' +
      '<div class="journal-field-label">' + escapeHtml(label) + '</div>' +
      '<div class="journal-field-body">' + escapeHtml(value) + '</div>' +
    '</div>';
  }

  function journalSomaHtml(label, value){
    if(value == null || !String(value).trim()) return '';
    return '<span class="journal-soma"><b>' + escapeHtml(label) + '</b> ' + escapeHtml(value) + '</span>';
  }

  function groupNotesBySession(rows){
    var map = {};
    (Array.isArray(rows) ? rows : []).forEach(function(n){
      if(!n || !n.session_id) return;
      if(!map[n.session_id]) map[n.session_id] = [];
      map[n.session_id].push(n);
    });
    return map;
  }

  function journalNoteHtml(n, coachUserId, athleteLabel){
    var authorId = n.author_id || n.coach_id;
    var mine = !!(coachUserId && authorId === coachUserId);
    var who = mine ? 'You' : (athleteLabel || 'Athlete');
    if(_editingJournalNoteId === n.id){
      return '<div class="journal-note' + (mine ? ' mine' : '') + '">' +
        '<textarea id="journal-note-edit-ta-' + n.id + '" rows="2" style="width:100%;box-sizing:border-box;">' + escapeHtml(n.note || '') + '</textarea>' +
        '<div style="display:flex;gap:8px;margin-top:6px;">' +
          '<button type="button" class="btn-primary" onclick="saveEditJournalNote(\'' + n.id + '\')">Save</button>' +
          '<button type="button" onclick="cancelEditJournalNote()">Cancel</button>' +
        '</div></div>';
    }
    return '<div class="journal-note' + (mine ? ' mine' : '') + '">' +
      '<div class="note-meta">' +
        '<span class="note-who">' + escapeHtml(who) + '</span>' +
        '<span class="mono"> · ' + fmtChatTime(n.created_at) + '</span>' +
        (n.edited_at ? ' <span style="font-style:italic;">(edited)</span>' : '') +
      '</div>' +
      '<div class="note-text">' + escapeHtml(n.note || '') + '</div>' +

    var res = await fetch(SB_URL + '/rest/v1/coach_notes?id=eq.' + id, {

  function journalNotesThreadHtml(sessionId, notes, notesError, coachUserId, athleteLabel){
    var sid = escapeHtml(sessionId);
    var body;
    if(notesError){
      var isMissingTable = notesError.code === 'PGRST205' || notesError.code === '42P01';

          '<div class="journal-route">' + escapeHtml(s.route_name || 'Unnamed climb') + '</div>' +
          '<div class="journal-when">' + fmtChatTime(s.created_at) + '</div>' +

        '<span class="journal-zone' + (zoneClass ? ' ' + zoneClass : '') + '">' +

  function renderJournalFeed(el){
    if(!el || !_journalCtx) return;

      return;

      return new Date(a.created_at) - new Date(b.created_at);
    });
    el.innerHTML = '<div class="panel-title">Journal · last ' + feed.length + '</div>' +
      feed.map(function(s){
        return journalEntryHtml(
          s,
          _journalNotesBySession[s.id] || [],
          _journalNotesError,
          coachUser && coachUser.id,
          athleteLabel
        );
      }).join('');

  function loadAthleteSessions(token, coachUser, athleteId, athleteLabel){

  function postJournalNote(sessionId){
    if(!_journalCtx || !sessionId) return;
    var token = _journalCtx.token;
    var coachUser = _journalCtx.coachUser;
    var athleteId = _journalCtx.athleteId;
    var ta = document.getElementById('journal-reply-' + sessionId);
    var msgEl = document.getElementById('journal-reply-msg-' + sessionId);
    var btn = document.querySelector('.journal-reply-btn[data-session-id="' + sessionId + '"]');
    var noteText = ta ? ta.value.trim() : '';
    if(!noteText){
      if(msgEl) msgEl.innerHTML = '<div class="form-error">Note text is required.</div>';
      return;
    }
    if(btn){
      btn.disabled = true;
      btn.textContent = 'Saving...';
    }
    fetch(SB_URL + '/rest/v1/coach_notes', {
      method: 'POST',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({
        author_id: coachUser.id,
        coach_id: coachUser.id,
        athlete_id: athleteId,
        session_id: sessionId,
        note: noteText
      })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      if(ta) ta.value = '';
      if(msgEl) msgEl.innerHTML = '';
      return loadJournalNotes(token, coachUser, athleteId).then(function(){
        var listEl = document.getElementById('journal-notes-' + sessionId);
        if(listEl){
          var notes = _journalNotesBySession[sessionId] || [];
          listEl.innerHTML = notes.length
            ? notes.map(function(n){
                return journalNoteHtml(n, coachUser.id, _journalCtx.athleteLabel);
              }).join('')
            : '<div class="form-note">No notes yet.</div>';
        }
      });
    }).catch(function(err){
      if(msgEl){
        msgEl.innerHTML = '<div class="form-error">Failed to save. ' +
          escapeHtml(err.message || 'Unknown error') + '</div>';
      }
    }).then(function(){
      if(btn){
        btn.disabled = false;
        btn.textContent = 'Reply';
      }
    });
  }

  // ── Coach ↔ athlete chat (coach_messages) ────────────────
  // Unread: athlete → coach messages with read_at null. Roster dots come from
  // a batched existence check; mark-read only when that athlete's thread is
  // visibly open (mirrors athlete-side Train badge / mark-on-view).
  var _coachChatViewingAthleteId = null;
  var _coachChatMessages = [];
  var _rosterUnreadAthletes = {};
  var _editingCoachChatMessageId = null;
  var _coachChatToken = null, _coachChatCoachUser = null, _coachChatAthleteLabel = '';

  function applyRosterUnreadDots(map){
    map = map || {};
    Array.prototype.forEach.call(document.querySelectorAll('.roster-row'), function(row){
      var aid = row.getAttribute('data-athlete-id');
      var label = row.getAttribute('data-athlete-label') || 'Athlete';
      var dot = row.querySelector('.roster-unread-dot');
      if(!dot) return;
      if(map[aid]){
        dot.removeAttribute('hidden');
        row.setAttribute('aria-label', label + ', unread message');
      } else {
        dot.setAttribute('hidden', '');
        row.removeAttribute('aria-label');
      }
    });
    paintAthleteHubBadges();
  }

  function clearRosterUnreadForAthlete(athleteId){
    if(!athleteId || !_rosterUnreadAthletes[athleteId]) return;
    delete _rosterUnreadAthletes[athleteId];
    applyRosterUnreadDots(_rosterUnreadAthletes);
    paintAthleteHubBadges();
  }

  // One query across the roster: any message from the athlete (not the coach)
  // with read_at null. Does not mark anything read.
  function refreshRosterChatUnread(token, coachUser, roster){
    var ids = (roster || []).map(function(r){ return r.athlete_id; }).filter(Boolean);
    if(!ids.length || !coachUser || !coachUser.id){
      _rosterUnreadAthletes = {};
      applyRosterUnreadDots({});
      return Promise.resolve();
    }
    return sbSelect(
      token,
      'coach_messages',
      'select=id,athlete_id,sender_id,read_at' +
        '&coach_id=eq.' + coachUser.id +
        '&athlete_id=in.(' + ids.join(',') + ')' +
        '&sender_id=neq.' + coachUser.id +
        '&read_at=is.null'
    ).then(function(rows){
      var map = {};
      (Array.isArray(rows) ? rows : []).forEach(function(m){
        if(m && m.athlete_id && m.sender_id && m.sender_id !== coachUser.id && !m.read_at){
          map[m.athlete_id] = true;
        }
      });
      _rosterUnreadAthletes = map;
      applyRosterUnreadDots(map);
    }).catch(function(){
      // Non-blocking — missing column/table shouldn't break roster.
    });
  }

  function coachChatIdsToMarkRead(rows, selfId){
    if(!selfId || !Array.isArray(rows)) return [];
    return rows.filter(function(m){
      return m && m.id && m.sender_id && m.sender_id !== selfId && !m.read_at;
    }).map(function(m){ return m.id; });
  }

  function isCoachViewingAthleteChat(athleteId){
    if(!athleteId || _coachChatViewingAthleteId !== athleteId) return false;
    if(_athletePane !== 'chat') return false;
    var active = document.querySelector('.roster-row.active');
    if(!active || active.getAttribute('data-athlete-id') !== athleteId) return false;
    return !!document.getElementById('chat-thread');
  }

  // PATCH read_at only for messages from the athlete. Own (coach) messages
  // excluded at the query level via sender_id=neq.<coachId>.
  function markCoachChatReadIfViewing(token, coachUser, athleteId){
    if(!isCoachViewingAthleteChat(athleteId)) return Promise.resolve(false);
    var selfId = coachUser && coachUser.id;
    if(!selfId) return Promise.resolve(false);
    var ids = coachChatIdsToMarkRead(_coachChatMessages, selfId);
    if(!ids.length){
      clearRosterUnreadForAthlete(athleteId);
      return Promise.resolve(true);
    }
    var now = new Date().toISOString();
    return fetch(
      SB_URL + '/rest/v1/coach_messages?coach_id=eq.' + encodeURIComponent(selfId) +
        '&athlete_id=eq.' + encodeURIComponent(athleteId) +
        '&sender_id=neq.' + encodeURIComponent(selfId) +
        '&read_at=is.null',
      {
        method: 'PATCH',
        headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
        body: JSON.stringify({ read_at: now })
      }
    ).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      _coachChatMessages.forEach(function(m){
        if(m.sender_id !== selfId && !m.read_at) m.read_at = now;
      });
      clearRosterUnreadForAthlete(athleteId);
      return true;
    }).catch(function(){
      return false;
    });
  }

  var _editingCoachAthleteNoteId = null;
  var _coachAthleteNotesCtx = null;

  function loadAthleteCoachNotes(token, coachUser, athleteId){

    }).catch(function(err){
      _coachAthleteNotesCache = [];
      paintAthleteHubBadges();

      el.innerHTML = '<div class="panel-title">Coach\'s Notes (private)</div><div class="form-error">' +
        (isMissingTable ? 'The <code>coach_athlete_notes</code> table isn\'t available yet.' :
        'Failed to load — ' + escapeHtml((err && err.message) || 'unknown error')) + '</div>';
    });

  function renderCoachAthleteNotes(el, notes){
    var list = notes.length
      ? notes.map(function(n){
          if(_editingCoachAthleteNoteId === n.id){
            return '<div class="coach-note-item">' +

              '<textarea id="coach-note-edit-body-' + n.id + '" rows="3" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:13px;">' + escapeHtml(n.body || '') + '</textarea>' +
              '<div style="display:flex;gap:8px;margin-top:6px;">' +
                '<button type="button" class="btn-primary" onclick="saveEditCoachAthleteNote(\'' + n.id + '\')">Save</button>' +
                '<button type="button" onclick="cancelEditCoachAthleteNote()">Cancel</button>' +
              '</div></div>';
          }
          return '<div class="coach-note-item">' +
            '<div class="coach-note-meta"><span class="coach-note-title">' + escapeHtml(n.title || 'Untitled') + '</span>' +
            '<span class="coach-note-time mono">' + fmtChatTime(n.created_at) + (n.edited_at ? ' · edited' : '') + '</span></div>' +
            '<div class="coach-note-body">' + escapeHtml(n.body || '') + '</div>' +
            '<div style="display:flex;gap:10px;margin-top:6px;">' +
              '<button type="button" onclick="startEditCoachAthleteNote(\'' + n.id + '\')" style="background:none;border:none;color:var(--text-secondary);font-size:11px;cursor:pointer;padding:0;">Edit</button>' +
              '<button type="button" onclick="deleteCoachAthleteNote(\'' + n.id + '\')" style="background:none;border:none;color:var(--text-secondary);font-size:11px;cursor:pointer;padding:0;">Delete</button>' +
            '</div>' +
          '</div>';
        }).join('')
      : '<div class="form-note">No notes yet — private to you, never visible to the athlete.</div>';

    el.innerHTML = '<div class="panel-title">Coach\'s Notes (private)</div>' +
      '<div class="coach-note-hint">Only you can see this — use it for call recaps, anything you don\'t want the athlete seeing.</div>' +
      '<div class="coach-note-list">' + list + '</div>' +
      '<div class="coach-note-form">' +
        '<input type="text" id="coach-note-title" placeholder="Title (e.g. \'Aug PC call\')" />' +
        '<textarea id="coach-note-body" rows="3" placeholder="Notes..."></textarea>' +
        '<button type="button" class="btn-primary" id="coach-note-save">Save note</button>' +
        '<div id="coach-note-msg"></div>' +
      '</div>';

    document.getElementById('coach-note-save').addEventListener('click', function(){
      var titleEl = document.getElementById('coach-note-title');
      var bodyEl = document.getElementById('coach-note-body');
      var msgEl = document.getElementById('coach-note-msg');
      var body = (bodyEl.value || '').trim();
      if(!body){ msgEl.innerHTML = '<div class="form-error">Note text is required.</div>'; return; }
      fetch(SB_URL + '/rest/v1/coach_athlete_notes', {
        method: 'POST',
        headers: Object.assign(sbHeaders(_coachAthleteNotesCtx.token), { 'Prefer': 'return=representation' }),
        body: JSON.stringify({
          coach_id: _coachAthleteNotesCtx.coachUser.id,
          athlete_id: _coachAthleteNotesCtx.athleteId,
          title: (titleEl.value || '').trim() || null,
          body: body
        })
      }).then(function(res){
        if(!res.ok) return res.json().then(function(err){ throw err; });
        return reloadCoachAthleteNotes();
      }).catch(function(err){
        msgEl.innerHTML = '<div class="form-error">Failed to save — ' + escapeHtml((err && err.message) || 'unknown error') + '</div>';
      });
    });
  }

  function reloadCoachAthleteNotes(){
    if(!_coachAthleteNotesCtx) return;
    return loadAthleteCoachNotes(_coachAthleteNotesCtx.token, _coachAthleteNotesCtx.coachUser, _coachAthleteNotesCtx.athleteId);
  }
  function startEditCoachAthleteNote(id){ _editingCoachAthleteNoteId = id; reloadCoachAthleteNotes(); }
  function cancelEditCoachAthleteNote(){ _editingCoachAthleteNoteId = null; reloadCoachAthleteNotes(); }
  async function saveEditCoachAthleteNote(id){
    var titleEl = document.getElementById('coach-note-edit-title-' + id);
    var bodyEl = document.getElementById('coach-note-edit-body-' + id);
    var text = bodyEl ? bodyEl.value.trim() : '';
    if(!text || !_coachAthleteNotesCtx) return;
    var res = await fetch(SB_URL + '/rest/v1/coach_athlete_notes?id=eq.' + id, {
      method: 'PATCH',

  }
  async function deleteCoachAthleteNote(id){
    if(!_coachAthleteNotesCtx || !confirm('Delete this note?')) return;
    var res = await fetch(SB_URL + '/rest/v1/coach_athlete_notes?id=eq.' + id, {
      method: 'DELETE',
      headers: sbHeaders(_coachAthleteNotesCtx.token)
    });
    if(!res.ok) return;
    reloadCoachAthleteNotes();
  }

  function chatMessageHtml(m, coachUserId, athleteLabel, grouped){
    var mine = m.sender_id === coachUserId;
    var who = mine ? 'You' : (athleteLabel || 'Athlete');
    if(_editingCoachChatMessageId === m.id){
      return '<div class="chat-msg' + (mine ? ' mine' : '') + (grouped ? ' grouped' : '') + '">' +
        '<textarea id="chat-edit-ta-' + m.id + '" rows="2" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--accent);border-radius:14px;padding:9px 12px;color:var(--text);font-family:\'Space Grotesk\',sans-serif;font-size:13.5px;">' + escapeHtml(m.body || '') + '</textarea>' +
        '<div style="display:flex;gap:8px;margin-top:6px;">' +
          '<button type="button" onclick="saveEditCoachChatMessage(\'' + m.id + '\')" style="background:var(--accent);border:none;border-radius:6px;color:#fff;font-family:\'Space Grotesk\',sans-serif;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;">Save</button>' +
          '<button type="button" onclick="cancelEditCoachChatMessage()" style="background:none;border:none;color:var(--text-secondary);font-family:\'Space Grotesk\',sans-serif;font-size:12px;font-weight:600;cursor:pointer;">Cancel</button>' +
        '</div></div>';
    }
    return '<div class="chat-msg' + (mine ? ' mine' : '') + (grouped ? ' grouped' : '') + '">' +
      '<div class="chat-msg-meta">' +
        '<span class="chat-msg-who">' + escapeHtml(who) + '</span>' +
        '<span class="chat-msg-time mono">' + fmtChatTime(m.created_at) + '</span>' +
        (m.edited_at ? ' <span style="font-style:italic;">(edited)</span>' : '') +
      '</div>' +
      '<div class="chat-msg-bubble">' + linkifyHttpText(m.body || '') + '</div>' +
      (mine ? '<button type="button" onclick="startEditCoachChatMessage(\'' + m.id + '\')" style="background:none;border:none;color:var(--text-secondary);font-size:11px;cursor:pointer;padding:2px 0;">Edit</button>' : '') +
    '</div>';
  }

  function startEditCoachChatMessage(id){
    _editingCoachChatMessageId = id;
    loadChatMessages(_coachChatToken, _coachChatCoachUser, _coachChatViewingAthleteId, _coachChatAthleteLabel);
  }
  function cancelEditCoachChatMessage(){
    _editingCoachChatMessageId = null;
    loadChatMessages(_coachChatToken, _coachChatCoachUser, _coachChatViewingAthleteId, _coachChatAthleteLabel);
  }
  async function saveEditCoachChatMessage(id){
    var ta = document.getElementById('chat-edit-ta-' + id);
    var text = ta ? ta.value.trim() : '';
    if(!text) return;
    var res = await fetch(SB_URL + '/rest/v1/coach_messages?id=eq.' + id, {
      method: 'PATCH',
      headers: Object.assign(sbHeaders(_coachChatToken), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ body: text, edited_at: new Date().toISOString() })
    });
    if(!res.ok) return;
    _editingCoachChatMessageId = null;
    loadChatMessages(_coachChatToken, _coachChatCoachUser, _coachChatViewingAthleteId, _coachChatAthleteLabel);
  }

  function renderChatSection(token, coachUser, athleteId, athleteLabel){
    var el = document.getElementById('detail-chat');
    if(!el) return;
    _coachChatViewingAthleteId = athleteId;
    _coachChatToken = token;
    _coachChatCoachUser = coachUser;
    _coachChatAthleteLabel = athleteLabel;
    _coachChatMessages = [];
    el.innerHTML =
      '<div class="panel-title">Chat</div>' +
      '<div id="chat-thread" class="chat-thread"><div class="chat-empty">Loading···</div></div>' +
      '<div class="chat-compose">' +
        '<textarea id="chat-input" rows="2" placeholder="Message ' + escapeHtml(athleteLabel || 'athlete') + '…"></textarea>' +
        '<button type="button" class="btn-primary" id="chat-send">Send</button>' +
      '</div>' +
      '<div id="chat-msg"></div>';

    loadChatMessages(token, coachUser, athleteId, athleteLabel);

    var input = document.getElementById('chat-input');
    var sendBtn = document.getElementById('chat-send');
    function doSend(){
      var msgEl = document.getElementById('chat-msg');
      var body = (input.value || '').trim();
      if(!body){
        msgEl.innerHTML = '<div class="form-error">Message is required.</div>';
        return;
      }
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      fetch(SB_URL + '/rest/v1/coach_messages', {
        method: 'POST',
        headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
        body: JSON.stringify({
          coach_id: coachUser.id,
          athlete_id: athleteId,
          sender_id: coachUser.id,
          body: body
        })
      }).then(function(res){
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
        if(!res.ok) return res.json().then(function(err){ throw err; });
        input.value = '';
        msgEl.innerHTML = '';
        // Reload then mark-if-viewing — own rows excluded by sender_id=neq.
        return loadChatMessages(token, coachUser, athleteId, athleteLabel);
      }).catch(function(err){
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
        var isMissingTable = err && (err.code === 'PGRST205' || err.code === '42P01');
        msgEl.innerHTML = '<div class="form-error">' +
          (isMissingTable
            ? 'The <code>coach_messages</code> table isn\'t available yet.'
            : 'Failed to send — ' + escapeHtml((err && err.message) || 'unknown error')) +
          '</div>';
      });
    }
    sendBtn.addEventListener('click', doSend);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        doSend();
      }
    });
  }

  function loadChatMessages(token, coachUser, athleteId, athleteLabel){
    var thread = document.getElementById('chat-thread');
    if(!thread) return Promise.resolve();
    return sbSelect(
      token,
      'coach_messages',
      'select=id,coach_id,athlete_id,sender_id,body,link,created_at,read_at,edited_at' +
        '&athlete_id=eq.' + athleteId +
        '&coach_id=eq.' + coachUser.id +
        '&order=created_at.asc'
    ).then(function(rows){
      // Stale response from a previously selected athlete — do not render or mark.
      if(_coachChatViewingAthleteId !== athleteId) return;
      _coachChatMessages = Array.isArray(rows) ? rows : [];
      if(!_coachChatMessages.length){
        thread.innerHTML = '<div class="chat-empty">No messages yet. Say hello.</div>';
      } else {
        thread.innerHTML = _coachChatMessages.map(function(m, i){
          var prev = _coachChatMessages[i - 1];
          var grouped = !!(prev && prev.sender_id === m.sender_id);
          return chatMessageHtml(m, coachUser.id, athleteLabel, grouped);
        }).join('');
        thread.scrollTop = thread.scrollHeight;
      }
      // Mark read only when this athlete's thread is actually open on screen.
      if(isCoachViewingAthleteChat(athleteId)){
        return markCoachChatReadIfViewing(token, coachUser, athleteId);
      }
    }).catch(function(err){
      if(_coachChatViewingAthleteId !== athleteId) return;
      var isMissingTable = err && (err.code === 'PGRST205' || err.code === '42P01');
      thread.innerHTML = '<div class="chat-empty" style="color:var(--danger);">' +
        (isMissingTable
          ? 'The <code>coach_messages</code> table isn\'t available yet.'
          : 'Failed to load chat — ' + escapeHtml((err && err.message) || 'unknown error')) +
        '</div>';
    });
  }

  /* ===================== ATHLETE VIEW ===================== */

  function renderAthleteView(token, user){
    mainEl.innerHTML =
      '<div class="training-header">' +
        '<div class="page-title">Training</div>' +
        '<div class="page-sub">Assignments from your coach, soonest due date first.</div>' +
      '</div>' +
      '<div class="panel" id="athlete-assignments"><div>Loading···</div></div>';

    loadAthleteAssignments(token, user);
  }

  function loadAthleteAssignments(token, user){
    var el = document.getElementById('athlete-assignments');
    sbSelect(token, 'assignments', 'select=*&athlete_id=eq.' + user.id + '&deleted_at=is.null&order=due_date.asc.nullslast')
      .then(function(rows){
        if(!rows.length){
          el.innerHTML = '<div class="stub">No assignments yet — check back after your coach assigns something.</div>';
          return;
        }
        el.innerHTML = renderAssignmentGroups(rows, true);

        Array.prototype.forEach.call(el.querySelectorAll('.assign-complete-btn'), function(btn){
          btn.addEventListener('click', function(){
            markComplete(token, user, btn.dataset.id, btn);
          });
        });
      })
      .catch(function(err){
        el.innerHTML = '<div class="stub" style="color:var(--danger);">Failed to load assignments — ' + escapeHtml(err.message || 'unknown error') + '</div>';
      });
  }

  function markComplete(token, user, assignmentId, btn){
    btn.disabled = true;
    btn.textContent = 'Saving...';
    // Deliberately sends ONLY completed_at — assignments' athlete-side RLS
    // currently allows updating any column, not just this one, so the app
    // itself is the only thing enforcing that an athlete can't touch title/
    // description/due_date/coach_id via this action.
    fetch(SB_URL + '/rest/v1/assignments?id=eq.' + assignmentId + '&athlete_id=eq.' + user.id, {
      method: 'PATCH',
      headers: Object.assign(sbHeaders(token), { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ completed_at: new Date().toISOString() })
    }).then(function(res){
      if(!res.ok) return res.json().then(function(err){ throw err; });
      loadAthleteAssignments(token, user);
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = 'Mark complete';
      alert('Failed to mark complete — ' + (err && err.message ? err.message : 'unknown error'));
    });
  }

  // Same site-root service worker as index.html (do not invent a second SW).
  function registerSEEServiceWorker(){
    if(typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return;
    var proto = (window.location && window.location.protocol) || '';
    if(proto !== 'https:' && proto !== 'http:') return;
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).catch(function(){});
  }
  if(document.readyState === 'complete') registerSEEServiceWorker();
  else window.addEventListener('load', registerSEEServiceWorker);

  window.startEditCoachChatMessage = startEditCoachChatMessage;
  window.cancelEditCoachChatMessage = cancelEditCoachChatMessage;
  window.saveEditCoachChatMessage = saveEditCoachChatMessage;
  window.startEditJournalNote = startEditJournalNote;
  window.cancelEditJournalNote = cancelEditJournalNote;
  window.saveEditJournalNote = saveEditJournalNote;
  window.startEditCoachAthleteNote = startEditCoachAthleteNote;
  window.cancelEditCoachAthleteNote = cancelEditCoachAthleteNote;
  window.saveEditCoachAthleteNote = saveEditCoachAthleteNote;
  window.deleteCoachAthleteNote = deleteCoachAthleteNote;

})();
</script>
</body>
</html>
